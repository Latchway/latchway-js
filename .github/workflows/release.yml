name: Release JavaScript SDK

on:
  repository_dispatch:
    types: [latchway_release_promoted]

permissions:
  contents: read

concurrency:
  group: js-sdk-release-${{ github.event.client_payload.repository.commit }}
  cancel-in-progress: false

env:
  NPM_CLI_ARCHIVE: npm-11.6.2.tgz
  NPM_CLI_BYTES: "2663834"
  NPM_CLI_ENTRY_COUNT: "2133"
  NPM_CLI_INTEGRITY: sha512-7iKzNfy8lWYs3zq4oFPa8EXZz5xt9gQNKJZau3B1ErLBb6bF7sBJ00x09485DOvRT2l5Gerbl3VlZNT57MxJVA==
  NPM_CLI_SHA256: 585f95094ee5cb2788ee11d90f2a518a7c9ef6e083fa141d0b63ca3383675a20
  NPM_CLI_SHA512: ee22b335fcbc95662cdf3ab8a053daf045d9cf9c6df6040d28965abb707512b2c16fa6c5eec049d34c74f78f390cebd14f697919eadb97756564d4f9eccc4954
  NPM_CLI_UNPACKED_BYTES: "11785613"
  NPM_CLI_URL: https://registry.npmjs.org/npm/-/npm-11.6.2.tgz
  NPM_CLI_VERSION: 11.6.2

jobs:
  authorize-promotion:
    name: Authenticate core promotion without candidate source
    if: github.repository == 'Latchway/latchway-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    outputs:
      commit: ${{ steps.coordinates.outputs.commit }}
    steps:
      - name: Validate dispatch envelope before network access
        id: coordinates
        shell: bash
        env:
          SDK_ID: ${{ github.event.client_payload.repository.id }}
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$SDK_ID" = javascript
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$SDK_TAG" = "v$SDK_VERSION"
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          test "$GITHUB_SHA" = "$SDK_COMMIT"
          printf 'commit=%s\n' "$SDK_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Require fixed GitHub attestation tooling without credentials
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh attestation verify --help >/dev/null
      - name: Download and hash the exact core promotion report
        shell: bash
        env:
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          CORE_READ_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          auth_config="$RUNNER_TEMP/latchway-core-release-auth"
          trap 'rm -f -- "$auth_config"' EXIT
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$CORE_READ_TOKEN" > "$auth_config"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" \
            --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --fail --location --silent --show-error --output "$report" "$REPORT_URL"
          rm -f -- "$auth_config"
          trap - EXIT
          printf '%s  %s\n' "$REPORT_SHA256" "$report" | sha256sum --check --strict
      - name: Verify the core workflow artifact attestation with read-only credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --repo Latchway/latchway \
            --signer-workflow Latchway/latchway/.github/workflows/cross-repository-conformance.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Transfer authenticated promotion report to credential-free validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-cross-repository-promotion.json
          if-no-files-found: error
          retention-days: 1

  verify-promotion:
    name: Validate candidate source against authenticated promotion
    if: github.repository == 'Latchway/latchway-js'
    needs: authorize-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.promotion.outputs.release_commit }}
      core_tag: ${{ steps.promotion.outputs.core_tag }}
      report_sha256: ${{ steps.promotion.outputs.report_sha256 }}
      tag: ${{ steps.promotion.outputs.release_tag }}
      version: ${{ steps.promotion.outputs.release_version }}
    steps:
      - name: Check out exact promoted JavaScript SDK source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize-promotion.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download authenticated core promotion report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-core-promotion
      - name: Validate exact report, dispatch, and local source bindings without credentials
        id: promotion
        shell: bash
        env:
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SDK_COMMIT"
          python3 scripts/verify-release-promotion.py \
            --report "$RUNNER_TEMP/sdk-core-promotion/latchway-cross-repository-promotion.json" \
            --report-url "$REPORT_URL" \
            --report-sha256 "$REPORT_SHA256" \
            --repository-id javascript \
            --repository-commit "$SDK_COMMIT" \
            --repository-version "$SDK_VERSION" \
            --repository-tag "$SDK_TAG" \
            --workflow-commit "$GITHUB_SHA" \
            --core-tag "$CORE_TAG" \
            --oci-image-digest "$OCI_IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  promote:
    name: Create or verify evidence-gated SDK tag without checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ needs.verify-promotion.outputs.commit }}
      tag: ${{ needs.verify-promotion.outputs.tag }}
      version: ${{ needs.verify-promotion.outputs.version }}
      core_tag: ${{ needs.verify-promotion.outputs.core_tag }}
      report_sha256: ${{ needs.verify-promotion.outputs.report_sha256 }}
    steps:
      - name: Create or verify evidence-gated annotated SDK tag using fixed API calls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify-promotion.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-promotion.outputs.tag }}
          CORE_TAG: ${{ needs.verify-promotion.outputs.core_tag }}
          REPORT_SHA256: ${{ needs.verify-promotion.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          message="JavaScript SDK $RELEASE_TAG

          Core promotion: $CORE_TAG
          Promotion evidence SHA-256: $REPORT_SHA256"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/sdk-tag-ref.json" 2> "$RUNNER_TEMP/sdk-tag-error.txt"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            test "$lookup_status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/sdk-tag-error.txt"
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" \
              --arg object "$RELEASE_COMMIT" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
              > "$RUNNER_TEMP/sdk-tag-object-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --input "$RUNNER_TEMP/sdk-tag-object-create.json" > "$RUNNER_TEMP/sdk-tag-result.json"
            tag_object=$(jq --raw-output '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/sdk-tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/sdk-tag-ref-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --input "$RUNNER_TEMP/sdk-tag-ref-create.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/sdk-tag-ref.json"
          fi
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/sdk-tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/sdk-tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/sdk-tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/sdk-tag-object.json" >/dev/null

  verify:
    if: github.repository == 'Latchway/latchway-js'
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promote.outputs.commit }}
      - name: Scan the exact promoted dependency inventory offline
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: .artifacts/dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned actionlint
        run: node scripts/install-actionlint.mjs
      - name: Verify annotated stable release tag
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/verify-release-tag.mjs
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - name: Install locked development dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run complete release-candidate gate
        run: pnpm release:check
      - name: Build deterministic source-provenanced documentation bundle
        env:
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          python3 scripts/build_docs_bundle.py \
            --output-dir .artifacts \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --require-clean
      - name: Re-verify tag and capture evidence
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_TAG_EVIDENCE_PATH: .artifacts/tag-evidence.json
        run: node scripts/verify-release-tag.mjs
      - name: Export verified package coordinates
        id: package
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/release-artifact-output.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            .artifacts/latchway-client-${{ steps.package.outputs.version }}.tgz
            .artifacts/latchway-openai-${{ steps.package.outputs.version }}.tgz
            .artifacts/latchway-vercel-ai-${{ steps.package.outputs.version }}.tgz
            .artifacts/latchway-langchain-${{ steps.package.outputs.version }}.tgz
            .artifacts/docs-bundle-${{ steps.package.outputs.version }}.tar.gz
            .artifacts/SHA256SUMS
            .artifacts/build-reproducibility.json
            .artifacts/contract-evidence.json
            .artifacts/dependency-vulnerability-scan.json
            .artifacts/package-evidence.json
            .artifacts/release-candidate-evidence.json
            .artifacts/tag-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  trusted-npm-cli:
    name: Prepare exact trusted-publishing npm CLI without credentials
    if: github.repository == 'Latchway/latchway-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Download and authenticate npm CLI without lifecycle scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          test "$NPM_CONFIG_IGNORE_SCRIPTS" = true
          test "$NPM_CLI_ARCHIVE" = "npm-$NPM_CLI_VERSION.tgz"
          test "$NPM_CLI_URL" = "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          [[ "$NPM_CLI_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$NPM_CLI_ENTRY_COUNT" =~ ^[1-9][0-9]{0,4}$ ]]
          [[ "$NPM_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NPM_CLI_SHA512" =~ ^[0-9a-f]{128}$ ]]
          [[ "$NPM_CLI_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$NPM_CLI_UNPACKED_BYTES" =~ ^[1-9][0-9]{0,8}$ ]]

          root="$RUNNER_TEMP/trusted-npm-cli"
          mkdir -m 700 "$root"
          archive="$root/$NPM_CLI_ARCHIVE"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 3145728 \
            --fail --silent --show-error --output "$archive" "$NPM_CLI_URL"

          shopt -s nullglob dotglob
          closure=("$root"/*)
          test "${#closure[@]}" = 1
          test "${closure[0]}" = "$archive"
          test -f "$archive"
          test ! -L "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$NPM_CLI_BYTES"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum --check --strict
          printf '%s  %s\n' "$NPM_CLI_SHA512" "$archive" | sha512sum --check --strict
          observed_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
          test "$observed_integrity" = "$NPM_CLI_INTEGRITY"
          gzip --test "$archive"

          entry_count=0
          while IFS= read -r entry; do
            [[ "$entry" =~ ^package/([A-Za-z0-9@._+-]+/)*[A-Za-z0-9@._+-]+$ ]]
            ((entry_count += 1))
          done < <(tar --list --gzip --file "$archive")
          test "$entry_count" = "$NPM_CLI_ENTRY_COUNT"
          type_count=0
          while IFS= read -r listing; do
            test "${listing:0:1}" = '-'
            ((type_count += 1))
          done < <(tar --list --verbose --gzip --file "$archive")
          test "$type_count" = "$NPM_CLI_ENTRY_COUNT"

          inspection="$RUNNER_TEMP/trusted-npm-cli-inspection"
          mkdir -m 700 "$inspection"
          tar --extract --gzip --file "$archive" --directory "$inspection" \
            --no-same-owner --no-same-permissions
          test -z "$(find "$inspection" -mindepth 1 ! -type d ! -type f -print -quit)"
          test "$(find "$inspection" -type f | wc -l | tr -d ' ')" = "$NPM_CLI_ENTRY_COUNT"
          unpacked_bytes=$(find "$inspection" -type f -exec stat --format='%s' {} + | \
            awk '{ total += $1 } END { print total + 0 }')
          test "$unpacked_bytes" = "$NPM_CLI_UNPACKED_BYTES"
          jq --exit-status --arg version "$NPM_CLI_VERSION" '
            .name == "npm" and .version == $version and
            .bin.npm == "bin/npm-cli.js" and .bin.npx == "bin/npx-cli.js"
          ' "$inspection/package/package.json" >/dev/null
      - name: Transfer exact npm CLI tarball as inert data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-npm-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-npm-cli/npm-11.6.2.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  github-draft:
    name: Create or verify GitHub draft without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: write
    outputs:
      release_state: ${{ steps.draft.outputs.release_state }}
    steps:
      - name: Preflight immutable release and create draft with fixed API calls
        id: draft
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null
          unset ADMIN_TOKEN
          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null

          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"
          status=$?
          set -e
          title="Latchway JavaScript SDKs $RELEASE_VERSION"
          if [[ "$status" -ne 0 ]]; then
            test "$status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/release-error.txt"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "$title"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          fi
          jq --exit-status --arg tag "$RELEASE_TAG" --arg title "$title" \
            --arg version "$RELEASE_VERSION" --arg docs "docs-bundle-$RELEASE_VERSION.tar.gz" '
            .tag_name == $tag and .name == $title and .prerelease == false and
            (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
            ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
            all(.assets[].name;
              . == "latchway-client-\($version).tgz" or
              . == "latchway-openai-\($version).tgz" or
              . == "latchway-vercel-ai-\($version).tgz" or
              . == "latchway-langchain-\($version).tgz" or
              . == $docs or . == "SHA256SUMS" or . == "build-reproducibility.json" or
              . == "contract-evidence.json" or . == "dependency-vulnerability-scan.json" or
              . == "package-evidence.json" or
              . == "post-publish-evidence.json" or . == "publish-input-evidence.json" or
              . == "release-candidate-evidence.json" or . == "tag-evidence.json" or
              . == "npm-registry-evidence-manifest.json" or
              test("^npm-(client|openai|vercel-ai|langchain)-(registry-version|registry-view|attestations|audit-signatures)\\.json$") or
              test("^npm-release-adoption-(client|openai|vercel-ai|langchain)-[1-9][0-9]*-[1-9][0-9]*\\.json$"))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          state=draft
          if [[ "$(jq --raw-output .immutable "$RUNNER_TEMP/release.json")" == true ]]; then state=immutable; fi
          printf 'release_state=%s\n' "$state" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish or adopt npm archive without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, trusted-npm-cli, github-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      publish_state: ${{ steps.registry.outputs.publish_state }}
    steps:
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download exact credential-free npm CLI handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-npm-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-npm-cli
      - name: Verify exact npm CLI closure before extraction or execution
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          test "$NPM_CONFIG_IGNORE_SCRIPTS" = true
          test "$NPM_CLI_ARCHIVE" = "npm-$NPM_CLI_VERSION.tgz"
          test "$NPM_CLI_URL" = "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          [[ "$NPM_CLI_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$NPM_CLI_ENTRY_COUNT" =~ ^[1-9][0-9]{0,4}$ ]]
          [[ "$NPM_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NPM_CLI_SHA512" =~ ^[0-9a-f]{128}$ ]]
          [[ "$NPM_CLI_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$NPM_CLI_UNPACKED_BYTES" =~ ^[1-9][0-9]{0,8}$ ]]

          root="$RUNNER_TEMP/trusted-npm-cli"
          archive="$root/$NPM_CLI_ARCHIVE"
          shopt -s nullglob dotglob
          closure=("$root"/*)
          test "${#closure[@]}" = 1
          test "${closure[0]}" = "$archive"
          test -f "$archive"
          test ! -L "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$NPM_CLI_BYTES"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum --check --strict
          printf '%s  %s\n' "$NPM_CLI_SHA512" "$archive" | sha512sum --check --strict
          observed_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
          test "$observed_integrity" = "$NPM_CLI_INTEGRITY"
          gzip --test "$archive"

          entry_count=0
          while IFS= read -r entry; do
            [[ "$entry" =~ ^package/([A-Za-z0-9@._+-]+/)*[A-Za-z0-9@._+-]+$ ]]
            ((entry_count += 1))
          done < <(tar --list --gzip --file "$archive")
          test "$entry_count" = "$NPM_CLI_ENTRY_COUNT"
          type_count=0
          while IFS= read -r listing; do
            test "${listing:0:1}" = '-'
            ((type_count += 1))
          done < <(tar --list --verbose --gzip --file "$archive")
          test "$type_count" = "$NPM_CLI_ENTRY_COUNT"

          runtime="$RUNNER_TEMP/trusted-npm-cli-runtime"
          mkdir -m 700 "$runtime"
          tar --extract --gzip --file "$archive" --directory "$runtime" \
            --no-same-owner --no-same-permissions
          test -z "$(find "$runtime" -mindepth 1 ! -type d ! -type f -print -quit)"
          test "$(find "$runtime" -type f | wc -l | tr -d ' ')" = "$NPM_CLI_ENTRY_COUNT"
          unpacked_bytes=$(find "$runtime" -type f -exec stat --format='%s' {} + | \
            awk '{ total += $1 } END { print total + 0 }')
          test "$unpacked_bytes" = "$NPM_CLI_UNPACKED_BYTES"
          jq --exit-status --arg version "$NPM_CLI_VERSION" '
            .name == "npm" and .version == $version and
            .bin.npm == "bin/npm-cli.js" and .bin.npx == "bin/npx-cli.js"
          ' "$runtime/package/package.json" >/dev/null
          cli="$runtime/package/bin/npm-cli.js"
          test -f "$cli"
          test ! -L "$cli"
          test "$("$cli" --version)" = "$NPM_CLI_VERSION"
          printf 'LATCHWAY_NPM_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - name: Download exact reviewed package without candidate source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/reviewed-release
      - name: Validate reviewed archive identity and checksum with fixed tooling
        shell: bash
        env:
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_STATE" == draft || "$RELEASE_STATE" == immutable ]]
          root="$RUNNER_TEMP/reviewed-release"
          package_names=(
            '@latchway/client'
            '@latchway/openai'
            '@latchway/vercel-ai'
            '@latchway/langchain'
          )
          tarballs=(
            "latchway-client-$RELEASE_VERSION.tgz"
            "latchway-openai-$RELEASE_VERSION.tgz"
            "latchway-vercel-ai-$RELEASE_VERSION.tgz"
            "latchway-langchain-$RELEASE_VERSION.tgz"
          )
          expected=(
            "${tarballs[@]}"
            "docs-bundle-$RELEASE_VERSION.tar.gz"
            SHA256SUMS
            build-reproducibility.json
            contract-evidence.json
            dependency-vulnerability-scan.json
            package-evidence.json
            release-candidate-evidence.json
            tag-evidence.json
          )
          shopt -s nullglob dotglob
          actual=("$root"/*)
          test "${#actual[@]}" = "${#expected[@]}"
          for file in "${actual[@]}"; do test -f "$file" && test ! -L "$file" && test -s "$file"; done
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-reviewed-assets.txt"
          printf '%s\n' "${actual[@]##*/}" | sort > "$RUNNER_TEMP/actual-reviewed-assets.txt"
          cmp --silent "$RUNNER_TEMP/expected-reviewed-assets.txt" "$RUNNER_TEMP/actual-reviewed-assets.txt"
          jq --exit-status --arg version "$RELEASE_VERSION" \
            --argjson names '["@latchway/client","@latchway/openai","@latchway/vercel-ai","@latchway/langchain"]' \
            --argjson tarballs "$(printf '%s\n' "${tarballs[@]}" | jq --raw-input --slurp 'split("\n")[:-1]')" '
            .schema_version == 2 and .kind == "latchway_npm_package_set_evidence" and
            .version == $version and .package_count == 4 and .publish_order == $names and
            (.packages | length) == 4 and (.packages | map(.package)) == $names and
            (.packages | map(.tarball)) == $tarballs and
            all(.packages[];
              (.entries | type) == "array" and (.entries | length) > 0 and
              (.entries | length) == (.entries | unique | length) and
              (.sha1 | test("^[0-9a-f]{40}$")) and (.sha256 | test("^[0-9a-f]{64}$")) and
              (.sha512 | test("^[0-9a-f]{128}$")) and
              (.integrity | test("^sha512-[A-Za-z0-9+/]+={0,2}$")))
          ' "$root/package-evidence.json" >/dev/null
          test "$(wc -l < "$root/SHA256SUMS" | tr -d ' ')" = 4
          (cd "$root" && sha256sum --check --strict SHA256SUMS)
          for index in "${!package_names[@]}"; do
            archive="$root/${tarballs[$index]}"
            test "$(wc -c < "$archive" | tr -d ' ')" -le 10485760
            archive_bytes=$(wc -c < "$archive" | tr -d ' ')
            archive_sha1=$(sha1sum "$archive" | cut -d ' ' -f 1)
            archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
            archive_sha512=$(sha512sum "$archive" | cut -d ' ' -f 1)
            archive_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
            jq --exit-status --arg name "${package_names[$index]}" \
              --arg tarball "${tarballs[$index]}" --argjson bytes "$archive_bytes" \
              --arg sha1 "$archive_sha1" --arg sha256 "$archive_sha256" \
              --arg sha512 "$archive_sha512" --arg integrity "$archive_integrity" '
              .packages[] | select(.package == $name) |
              .tarball == $tarball and .bytes == $bytes and .sha1 == $sha1 and
              .sha256 == $sha256 and .sha512 == $sha512 and .integrity == $integrity
            ' "$root/package-evidence.json" >/dev/null
            tar --list --gzip --file "$archive" | LC_ALL=C sort > "$RUNNER_TEMP/archive-$index.txt"
            entry_count=$(wc -l < "$RUNNER_TEMP/archive-$index.txt" | tr -d ' ')
            test "$entry_count" -ge 1
            test "$entry_count" -le 512
            while IFS= read -r entry; do
              [[ "$entry" =~ ^package/([A-Za-z0-9@._+-]+/)*[A-Za-z0-9@._+-]+$ ]]
            done < "$RUNNER_TEMP/archive-$index.txt"
            jq --exit-status --raw-output --arg name "${package_names[$index]}" \
              '.packages[] | select(.package == $name) | .entries[]' "$root/package-evidence.json" | \
              LC_ALL=C sort > "$RUNNER_TEMP/evidence-entries-$index.txt"
            cmp --silent "$RUNNER_TEMP/evidence-entries-$index.txt" "$RUNNER_TEMP/archive-$index.txt"
            type_count=0
            while IFS= read -r listing; do
              test "${listing:0:1}" = '-'
              ((type_count += 1))
            done < <(tar --list --verbose --gzip --file "$archive")
            test "$type_count" = "$entry_count"
            test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .name)" = "${package_names[$index]}"
            test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .version)" = "$RELEASE_VERSION"
          done
      - name: Attest reviewed npm package set and reproducibility inputs without candidate checkout
        if: needs.github-draft.outputs.release_state == 'draft'
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/reviewed-release/latchway-client-${{ needs.verify.outputs.version }}.tgz
            ${{ runner.temp }}/reviewed-release/latchway-openai-${{ needs.verify.outputs.version }}.tgz
            ${{ runner.temp }}/reviewed-release/latchway-vercel-ai-${{ needs.verify.outputs.version }}.tgz
            ${{ runner.temp }}/reviewed-release/latchway-langchain-${{ needs.verify.outputs.version }}.tgz
            ${{ runner.temp }}/reviewed-release/package-evidence.json
            ${{ runner.temp }}/reviewed-release/build-reproducibility.json
      - name: Publish or adopt exact npm bytes with fixed commands
        id: registry
        shell: bash
        env:
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/reviewed-release"
          package_names=('@latchway/client' '@latchway/openai' '@latchway/vercel-ai' '@latchway/langchain')
          package_ids=(client openai vercel-ai langchain)
          registry_paths=(
            '%40latchway%2Fclient'
            '%40latchway%2Fopenai'
            '%40latchway%2Fvercel-ai'
            '%40latchway%2Flangchain'
          )
          tarballs=(
            "latchway-client-$RELEASE_VERSION.tgz"
            "latchway-openai-$RELEASE_VERSION.tgz"
            "latchway-vercel-ai-$RELEASE_VERSION.tgz"
            "latchway-langchain-$RELEASE_VERSION.tgz"
          )
          publish_required=()
          for index in "${!package_names[@]}"; do
            package_name=${package_names[$index]}
            package_id=${package_ids[$index]}
            archive="$root/${tarballs[$index]}"
            metadata="$RUNNER_TEMP/npm-version-$package_id.json"
            expected_integrity=$(jq --exit-status --raw-output --arg name "$package_name" \
              '.packages[] | select(.package == $name) | .integrity' "$root/package-evidence.json")
            expected_shasum=$(jq --exit-status --raw-output --arg name "$package_name" \
              '.packages[] | select(.package == $name) | .sha1' "$root/package-evidence.json")
            [[ "$expected_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
            [[ "$expected_shasum" =~ ^[0-9a-f]{40}$ ]]
            status=$(curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
              --silent --show-error --output "$metadata" --write-out '%{http_code}' \
              "https://registry.npmjs.org/${registry_paths[$index]}/$RELEASE_VERSION")
            if [[ "$status" == 200 ]]; then
              test "$(jq --raw-output .name "$metadata")" = "$package_name"
              test "$(jq --raw-output .version "$metadata")" = "$RELEASE_VERSION"
              test "$(jq --raw-output .dist.integrity "$metadata")" = "$expected_integrity"
              test "$(jq --raw-output .dist.shasum "$metadata")" = "$expected_shasum"
              remote_tarball=$(jq --exit-status --raw-output '.dist.tarball | strings' "$metadata")
              [[ "$remote_tarball" == https://registry.npmjs.org/"$package_name"/-/*.tgz ]]
              [[ "${remote_tarball##*/}" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
              curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
                --fail --silent --show-error --output "$RUNNER_TEMP/existing-$package_id.tgz" "$remote_tarball"
              cmp --silent "$archive" "$RUNNER_TEMP/existing-$package_id.tgz"
              publish_required[$index]=false
            else
              test "$status" = 404
              test "$RELEASE_STATE" = draft
              publish_required[$index]=true
            fi
          done
          publish_state='{}'
          for index in "${!package_names[@]}"; do
            package_name=${package_names[$index]}
            archive="$root/${tarballs[$index]}"
            publish_performed=false
            if [[ "${publish_required[$index]}" == true ]]; then
              "$LATCHWAY_NPM_CLI" publish "$archive" --provenance --access public \
                --registry=https://registry.npmjs.org/
              publish_performed=true
            fi
            publish_state=$(jq --compact-output --null-input --argjson current "$publish_state" \
              --arg name "$package_name" --argjson performed "$publish_performed" \
              '$current + {($name): $performed}')
          done
          printf 'publish_state=%s\n' "$publish_state" >> "$GITHUB_OUTPUT"

  publish:
    name: Generate and stage npm registry evidence without OIDC
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, github-draft, npm-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
    steps:
      - name: Configure isolated npm runtime paths
        shell: bash
        run: |
          printf '%s\n' \
            "NPM_CONFIG_CACHE=$RUNNER_TEMP/latchway-npm-cache" \
            "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/latchway-release.npmrc" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promote.outputs.commit }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .artifacts
      - name: Prepare tokenless npm verification runtime
        run: node scripts/prepare-verification-runtime.mjs
      - name: Re-verify annotated release tag
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/verify-release-tag.mjs
      - name: Verify downloaded release artifact
        run: node scripts/verify-release-artifact.mjs
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
      - name: Verify registry integrity, exports, signatures, and provenance
        id: registry_evidence
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          PUBLISH_STATE_JSON: ${{ needs.npm-publish.outputs.publish_state }}
        run: node scripts/verify-published.mjs
      - name: Stage exact JavaScript release assets for isolated GitHub publication
        env:
          ADOPTION_ASSET_COUNT: ${{ steps.registry_evidence.outputs.adoption_asset_count }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          test "$ADOPTION_ASSET_COUNT" = 4
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          destination="$RUNNER_TEMP/javascript-release-assets"
          mkdir -m 700 "$destination"
          package_ids=(client openai vercel-ai langchain)
          fixed_assets=(
            ".artifacts/latchway-client-$RELEASE_VERSION.tgz"
            ".artifacts/latchway-openai-$RELEASE_VERSION.tgz"
            ".artifacts/latchway-vercel-ai-$RELEASE_VERSION.tgz"
            ".artifacts/latchway-langchain-$RELEASE_VERSION.tgz"
            ".artifacts/docs-bundle-$RELEASE_VERSION.tar.gz"
            .artifacts/SHA256SUMS
            .artifacts/build-reproducibility.json
            .artifacts/contract-evidence.json
            .artifacts/dependency-vulnerability-scan.json
            .artifacts/package-evidence.json
            .artifacts/post-publish-evidence.json
            .artifacts/publish-input-evidence.json
            .artifacts/release-candidate-evidence.json
            .artifacts/tag-evidence.json
            .artifacts/npm-registry-evidence-manifest.json
          )
          for package_id in "${package_ids[@]}"; do
            fixed_assets+=(
              ".artifacts/npm-$package_id-registry-version.json"
              ".artifacts/npm-$package_id-registry-view.json"
              ".artifacts/npm-$package_id-attestations.json"
              ".artifacts/npm-$package_id-audit-signatures.json"
            )
          done
          shopt -s nullglob
          adoption_assets=(.artifacts/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 4
          for package_id in "${package_ids[@]}"; do
            matches=(.artifacts/npm-release-adoption-"$package_id"-*.json)
            test "${#matches[@]}" = 1
            [[ "${matches[0]##*/}" =~ ^npm-release-adoption-${package_id}-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          done
          for asset in "${fixed_assets[@]}" "${adoption_assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          install -m 600 -- "${fixed_assets[@]}" "${adoption_assets[@]}" "$destination/"
      - name: Transfer exact JavaScript assets to the no-checkout publication job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-javascript-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/javascript-release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  github-release-policy:
    name: Re-verify immutable release policy without OIDC or candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
    steps:
      - name: Verify immutable releases remain enforced with the protected admin credential
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          unset ADMIN_TOKEN
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null

  github-release:
    name: Publish immutable GitHub release without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, publish, github-release-policy, github-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download exact JavaScript release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-javascript-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/javascript-release-assets
      - name: Validate exact JavaScript asset closure before OIDC attestation
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          asset_root="$RUNNER_TEMP/javascript-release-assets"
          package_ids=(client openai vercel-ai langchain)
          package_names=('@latchway/client' '@latchway/openai' '@latchway/vercel-ai' '@latchway/langchain')
          tarballs=(
            "latchway-client-$RELEASE_VERSION.tgz"
            "latchway-openai-$RELEASE_VERSION.tgz"
            "latchway-vercel-ai-$RELEASE_VERSION.tgz"
            "latchway-langchain-$RELEASE_VERSION.tgz"
          )
          shopt -s nullglob
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 4
          expected=(
            "latchway-client-$RELEASE_VERSION.tgz"
            "latchway-openai-$RELEASE_VERSION.tgz"
            "latchway-vercel-ai-$RELEASE_VERSION.tgz"
            "latchway-langchain-$RELEASE_VERSION.tgz"
            "docs-bundle-$RELEASE_VERSION.tar.gz"
            SHA256SUMS
            build-reproducibility.json
            contract-evidence.json
            dependency-vulnerability-scan.json
            package-evidence.json
            post-publish-evidence.json
            publish-input-evidence.json
            release-candidate-evidence.json
            tag-evidence.json
            npm-registry-evidence-manifest.json
          )
          manifest_sha256=$(sha256sum "$asset_root/npm-registry-evidence-manifest.json" | cut -d ' ' -f 1)
          for index in "${!package_ids[@]}"; do
            package_id=${package_ids[$index]}
            package_name=${package_names[$index]}
            expected+=(
              "npm-$package_id-registry-version.json"
              "npm-$package_id-registry-view.json"
              "npm-$package_id-attestations.json"
              "npm-$package_id-audit-signatures.json"
            )
            for evidence_kind in registry-version registry-view attestations audit-signatures; do
              evidence_name="npm-$package_id-$evidence_kind.json"
              evidence_path="$asset_root/$evidence_name"
              evidence_sha256=$(sha256sum "$evidence_path" | cut -d ' ' -f 1)
              evidence_bytes=$(wc -c < "$evidence_path" | tr -d ' ')
              jq --exit-status --arg package "$package_name" --arg name "$evidence_name" \
                --arg sha256 "$evidence_sha256" --argjson bytes "$evidence_bytes" '
                .packages[] | select(.package == $package) |
                any(.evidence[]; .name == $name and .sha256 == $sha256 and .bytes == $bytes)
              ' "$asset_root/npm-registry-evidence-manifest.json" >/dev/null
            done
            archive_path="$asset_root/${tarballs[$index]}"
            archive_sha256=$(sha256sum "$archive_path" | cut -d ' ' -f 1)
            archive_sha512=$(sha512sum "$archive_path" | cut -d ' ' -f 1)
            archive_integrity="sha512-$(openssl dgst -sha512 -binary "$archive_path" | base64 -w 0)"
            archive_bytes=$(wc -c < "$archive_path" | tr -d ' ')
            jq --exit-status --arg package "$package_name" --arg name "${tarballs[$index]}" \
              --arg sha256 "$archive_sha256" --arg sha512 "$archive_sha512" \
              --arg integrity "$archive_integrity" --argjson bytes "$archive_bytes" '
              .packages[] | select(.package == $package) |
              .tarball == {name: $name, bytes: $bytes, sha256: $sha256,
                sha512: $sha512, integrity: $integrity}
            ' "$asset_root/npm-registry-evidence-manifest.json" >/dev/null
            matches=("$asset_root"/npm-release-adoption-"$package_id"-*.json)
            test "${#matches[@]}" = 1
            adoption_name=${matches[0]##*/}
            [[ "$adoption_name" =~ ^npm-release-adoption-${package_id}-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
            test "$adoption_name" = "npm-release-adoption-$package_id-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            jq --exit-status --arg package "$package_name" --arg version "$RELEASE_VERSION" \
              --arg tag "$RELEASE_TAG" --arg repository "https://github.com/$GITHUB_REPOSITORY" \
              --arg commit "$RELEASE_COMMIT" --arg tarball "${tarballs[$index]}" \
              --arg manifest_sha256 "$manifest_sha256" --argjson run "$GITHUB_RUN_ID" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" --slurpfile reviewed "$asset_root/package-evidence.json" '
              ($reviewed[0].packages[] | select(.package == $package)) as $package_evidence |
              .schema_version == 1 and .kind == "latchway_npm_release_adoption" and
              .package == $package and .version == $version and .release_tag == $tag and
              .tarball == {
                name: $tarball, bytes: $package_evidence.bytes, sha256: $package_evidence.sha256,
                sha512: $package_evidence.sha512, integrity: $package_evidence.integrity
              } and
              .source == {repository: $repository, commit: $commit,
                workflow: ".github/workflows/release.yml", ref: "refs/heads/main"} and
              (.provenance as $provenance |
                $provenance.repository == $repository and $provenance.commit == $commit and
                $provenance.workflow == ".github/workflows/release.yml" and
                $provenance.ref == "refs/heads/main" and
                $provenance.predicate_type == "https://slsa.dev/provenance/v1" and
                ($provenance.run_id | type) == "number" and $provenance.run_id >= 1 and
                ($provenance.run_attempt | type) == "number" and $provenance.run_attempt >= 1 and
                $provenance.invocation_id == ($repository + "/actions/runs/" +
                  ($provenance.run_id | tostring) + "/attempts/" + ($provenance.run_attempt | tostring))) and
              .adoption.repository == $repository and .adoption.commit == $commit and
              .adoption.workflow == ".github/workflows/release.yml" and
              .adoption.ref == "refs/heads/main" and .adoption.run_id == $run and
              .adoption.run_attempt == $attempt and
              (.adoption.mode == "published" or .adoption.mode == "adopted_existing") and
              .registry_evidence_manifest == {
                file: "npm-registry-evidence-manifest.json", sha256: $manifest_sha256
              }
            ' "${matches[0]}" >/dev/null
            expected+=("$adoption_name")
          done
          jq --exit-status --arg version "$RELEASE_VERSION" \
            --argjson names '["@latchway/client","@latchway/openai","@latchway/vercel-ai","@latchway/langchain"]' '
            .schema_version == 2 and .kind == "latchway_npm_registry_package_set_evidence_manifest" and
            .version == $version and .package_count == 4 and .publish_order == $names and
            (.packages | map(.package)) == $names and all(.packages[]; (.evidence | length) == 4)
          ' "$asset_root/npm-registry-evidence-manifest.json" >/dev/null
          jq --exit-status --arg version "$RELEASE_VERSION" --arg manifest_sha256 "$manifest_sha256" \
            --argjson names '["@latchway/client","@latchway/openai","@latchway/vercel-ai","@latchway/langchain"]' '
            .schema_version == 3 and .kind == "latchway_npm_package_set_publication_evidence" and
            .version == $version and .package_count == 4 and .publish_order == $names and
            (.packages | map(.package)) == $names and
            .evidence_manifest.file == "npm-registry-evidence-manifest.json" and
            .evidence_manifest.sha256 == $manifest_sha256
          ' "$asset_root/post-publish-evidence.json" >/dev/null
          jq --exit-status --arg version "$RELEASE_VERSION" --arg commit "$RELEASE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --argjson names '["@latchway/client","@latchway/openai","@latchway/vercel-ai","@latchway/langchain"]' '
            .schema_version == 2 and .kind == "latchway_npm_publish_input_evidence" and
            .version == $version and .source_commit == $commit and .release_tag == $tag and
            .package_count == 4 and .publish_order == $names and (.packages | map(.package)) == $names and
            .consumer.package_count == 4 and .consumer.node_esm == true and
            .consumer.typescript == false and .consumer.peer_source == "registry"
          ' "$asset_root/publish-input-evidence.json" >/dev/null
          test "${#expected[@]}" = 35
          actual=("$asset_root"/*)
          test "${#actual[@]}" = "${#expected[@]}"
          for asset in "${actual[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          printf '%s\n' "${actual[@]##*/}" | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          cmp --silent "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Attest exact retained registry and release evidence without candidate checkout
        if: needs.github-draft.outputs.release_state == 'draft'
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/javascript-release-assets/*
      - name: Reconcile, publish, and verify immutable release with fixed API calls
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh release verify --help | grep --fixed-strings -- '--format' >/dev/null
          gh release verify-asset --help | grep --fixed-strings -- '--format' >/dev/null

          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN

          asset_root="$RUNNER_TEMP/javascript-release-assets"
          package_ids=(client openai vercel-ai langchain)
          shopt -s nullglob
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 4
          fixed_assets=(
            "$asset_root/latchway-client-$RELEASE_VERSION.tgz"
            "$asset_root/latchway-openai-$RELEASE_VERSION.tgz"
            "$asset_root/latchway-vercel-ai-$RELEASE_VERSION.tgz"
            "$asset_root/latchway-langchain-$RELEASE_VERSION.tgz"
            "$asset_root/docs-bundle-$RELEASE_VERSION.tar.gz"
            "$asset_root/SHA256SUMS"
            "$asset_root/build-reproducibility.json"
            "$asset_root/contract-evidence.json"
            "$asset_root/dependency-vulnerability-scan.json"
            "$asset_root/package-evidence.json"
            "$asset_root/post-publish-evidence.json"
            "$asset_root/publish-input-evidence.json"
            "$asset_root/release-candidate-evidence.json"
            "$asset_root/tag-evidence.json"
            "$asset_root/npm-registry-evidence-manifest.json"
          )
          for package_id in "${package_ids[@]}"; do
            fixed_assets+=(
              "$asset_root/npm-$package_id-registry-version.json"
              "$asset_root/npm-$package_id-registry-view.json"
              "$asset_root/npm-$package_id-attestations.json"
              "$asset_root/npm-$package_id-audit-signatures.json"
            )
            matches=("$asset_root"/npm-release-adoption-"$package_id"-*.json)
            test "${#matches[@]}" = 1
            [[ "${matches[0]##*/}" =~ ^npm-release-adoption-${package_id}-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          done
          : > "$RUNNER_TEMP/fixed-assets.txt"
          for asset in "${fixed_assets[@]}" "${adoption_assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          for asset in "${fixed_assets[@]}"; do printf '%s\n' "${asset##*/}" >> "$RUNNER_TEMP/fixed-assets.txt"; done
          test "$(sort -u "$RUNNER_TEMP/fixed-assets.txt" | wc -l | tr -d ' ')" = 31
          fixed_names=$(sort "$RUNNER_TEMP/fixed-assets.txt" | jq --raw-input --slurp 'split("\n")[:-1]')

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null

          lookup_release() {
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          }
          lookup_release
          title="Latchway JavaScript SDKs $RELEASE_VERSION"
          validate_release() {
            local allow_draft=$1
            jq --exit-status --arg tag "$RELEASE_TAG" --arg title "$title" \
              --argjson fixed "$fixed_names" --argjson allow_draft "$allow_draft" '
              . as $release |
              .tag_name == $tag and .name == $title and .prerelease == false and
              (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
              ($allow_draft or .draft == false) and
              ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              all($release.assets[].name; . as $name | ($fixed | index($name)) != null or
                ($name | test("^npm-release-adoption-(client|openai|vercel-ai|langchain)-[1-9][0-9]*-[1-9][0-9]*\\.json$")))
            ' "$RUNNER_TEMP/release.json" >/dev/null
          }
          validate_release true
          verify_or_upload() {
            local asset=$1 name remote_count remote_id remote_size downloaded
            name=${asset##*/}
            remote_count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")
            test "$remote_count" -le 1
            if [[ "$remote_count" -eq 1 ]]; then
              remote_id=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/release.json")
              remote_size=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .size' "$RUNNER_TEMP/release.json")
              test "$remote_size" = "$(wc -c < "$asset" | tr -d ' ')"
              downloaded="$RUNNER_TEMP/existing-$name"
              gh api --method GET -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" > "$downloaded"
              cmp --silent "$asset" "$downloaded"
              return
            fi
            test "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" = true
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          }
          for asset in "${fixed_assets[@]}"; do verify_or_upload "$asset"; done
          for package_id in "${package_ids[@]}"; do
            matches=("$asset_root"/npm-release-adoption-"$package_id"-*.json)
            test "${#matches[@]}" = 1
            adoption_name=${matches[0]##*/}
            if [[ "$(jq --arg name "$adoption_name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")" -eq 1 ||
                  "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
              verify_or_upload "${matches[0]}"
            else
              pattern="^npm-release-adoption-${package_id}-[1-9][0-9]*-[1-9][0-9]*\\.json$"
              test "$(jq --arg pattern "$pattern" '[.assets[].name | select(test($pattern))] | length' "$RUNNER_TEMP/release.json")" -ge 1
            fi
          done
          lookup_release
          validate_release true
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            ([$release.assets[].name] - $fixed | all(test("^npm-release-adoption-(client|openai|vercel-ai|langchain)-[1-9][0-9]*-[1-9][0-9]*\\.json$"))) and
            all($fixed[]; . as $name | ($release.assets | map(.name) | index($name)) != null) and
            all(["client", "openai", "vercel-ai", "langchain"][]; . as $id |
              any($release.assets[].name; test("^npm-release-adoption-" + $id + "-[1-9][0-9]*-[1-9][0-9]*\\.json$")))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi
          lookup_release
          validate_release false
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            all($fixed[]; . as $name | ($release.assets | map(.name) | index($name)) != null) and
            all(["client", "openai", "vercel-ai", "langchain"][]; . as $id |
              any($release.assets[].name; test("^npm-release-adoption-" + $id + "-[1-9][0-9]*-[1-9][0-9]*\\.json$")))
          ' "$RUNNER_TEMP/release.json" >/dev/null

          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-attestation.json"; then verified=true; break; fi
            test "$attempt" = 12 || sleep 10
          done
          test "$verified" = true
          for asset in "${fixed_assets[@]}"; do
            verified=false
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --format json \
                > "$RUNNER_TEMP/${asset##*/}.attestation.json"; then verified=true; break; fi
              test "$attempt" = 12 || sleep 10
            done
            test "$verified" = true
          done
