name: Release JavaScript SDK

on:
  repository_dispatch:
    types: [latchway_release_promoted]

permissions:
  contents: read

concurrency:
  group: js-sdk-release-${{ github.event.client_payload.repository.commit }}
  cancel-in-progress: false

jobs:
  authorize-promotion:
    name: Authenticate core promotion without candidate source
    if: github.repository == 'Latchway/latchway-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    outputs:
      commit: ${{ steps.coordinates.outputs.commit }}
    steps:
      - name: Validate dispatch envelope before network access
        id: coordinates
        shell: bash
        env:
          SDK_ID: ${{ github.event.client_payload.repository.id }}
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$SDK_ID" = javascript
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$SDK_TAG" = "v$SDK_VERSION"
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          test "$GITHUB_SHA" = "$SDK_COMMIT"
          printf 'commit=%s\n' "$SDK_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Require fixed GitHub attestation tooling without credentials
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh attestation verify --help >/dev/null
      - name: Download and hash the exact core promotion report
        shell: bash
        env:
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          CORE_READ_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          auth_config="$RUNNER_TEMP/latchway-core-release-auth"
          trap 'rm -f -- "$auth_config"' EXIT
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$CORE_READ_TOKEN" > "$auth_config"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" \
            --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --fail --location --silent --show-error --output "$report" "$REPORT_URL"
          rm -f -- "$auth_config"
          trap - EXIT
          printf '%s  %s\n' "$REPORT_SHA256" "$report" | sha256sum --check --strict
      - name: Verify the core workflow artifact attestation with read-only credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --repo Latchway/latchway \
            --signer-workflow Latchway/latchway/.github/workflows/cross-repository-conformance.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Transfer authenticated promotion report to credential-free validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-cross-repository-promotion.json
          if-no-files-found: error
          retention-days: 1

  verify-promotion:
    name: Validate candidate source against authenticated promotion
    if: github.repository == 'Latchway/latchway-js'
    needs: authorize-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.promotion.outputs.release_commit }}
      core_tag: ${{ steps.promotion.outputs.core_tag }}
      report_sha256: ${{ steps.promotion.outputs.report_sha256 }}
      tag: ${{ steps.promotion.outputs.release_tag }}
      version: ${{ steps.promotion.outputs.release_version }}
    steps:
      - name: Check out exact promoted JavaScript SDK source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize-promotion.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download authenticated core promotion report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-core-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-core-promotion
      - name: Validate exact report, dispatch, and local source bindings without credentials
        id: promotion
        shell: bash
        env:
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$SDK_COMMIT"
          python3 scripts/verify-release-promotion.py \
            --report "$RUNNER_TEMP/sdk-core-promotion/latchway-cross-repository-promotion.json" \
            --report-url "$REPORT_URL" \
            --report-sha256 "$REPORT_SHA256" \
            --repository-id javascript \
            --repository-commit "$SDK_COMMIT" \
            --repository-version "$SDK_VERSION" \
            --repository-tag "$SDK_TAG" \
            --workflow-commit "$GITHUB_SHA" \
            --core-tag "$CORE_TAG" \
            --oci-image-digest "$OCI_IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  promote:
    name: Create or verify evidence-gated SDK tag without checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: verify-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ needs.verify-promotion.outputs.commit }}
      tag: ${{ needs.verify-promotion.outputs.tag }}
      version: ${{ needs.verify-promotion.outputs.version }}
      core_tag: ${{ needs.verify-promotion.outputs.core_tag }}
      report_sha256: ${{ needs.verify-promotion.outputs.report_sha256 }}
    steps:
      - name: Create or verify evidence-gated annotated SDK tag using fixed API calls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify-promotion.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-promotion.outputs.tag }}
          CORE_TAG: ${{ needs.verify-promotion.outputs.core_tag }}
          REPORT_SHA256: ${{ needs.verify-promotion.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          message="JavaScript SDK $RELEASE_TAG

          Core promotion: $CORE_TAG
          Promotion evidence SHA-256: $REPORT_SHA256"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/sdk-tag-ref.json" 2> "$RUNNER_TEMP/sdk-tag-error.txt"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            test "$lookup_status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/sdk-tag-error.txt"
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" \
              --arg object "$RELEASE_COMMIT" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
              > "$RUNNER_TEMP/sdk-tag-object-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --input "$RUNNER_TEMP/sdk-tag-object-create.json" > "$RUNNER_TEMP/sdk-tag-result.json"
            tag_object=$(jq --raw-output '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              "$RUNNER_TEMP/sdk-tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/sdk-tag-ref-create.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --input "$RUNNER_TEMP/sdk-tag-ref-create.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/sdk-tag-ref.json"
          fi
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/sdk-tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/sdk-tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/sdk-tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/sdk-tag-object.json" >/dev/null

  verify:
    if: github.repository == 'Latchway/latchway-js'
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      integrity: ${{ steps.package.outputs.integrity }}
      sha256: ${{ steps.package.outputs.sha256 }}
      tarball: ${{ steps.package.outputs.tarball }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promote.outputs.commit }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned actionlint
        run: node scripts/install-actionlint.mjs
      - name: Verify annotated stable release tag
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/verify-release-tag.mjs
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.15.0
          run_install: false
      - name: Install locked development dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run complete release-candidate gate
        run: pnpm release:check
      - name: Re-verify tag and capture evidence
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_TAG_EVIDENCE_PATH: .artifacts/tag-evidence.json
        run: node scripts/verify-release-tag.mjs
      - name: Export verified package coordinates
        id: package
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/release-artifact-output.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            .artifacts/${{ steps.package.outputs.tarball }}
            .artifacts/SHA256SUMS
            .artifacts/build-reproducibility.json
            .artifacts/contract-evidence.json
            .artifacts/package-evidence.json
            .artifacts/release-candidate-evidence.json
            .artifacts/tag-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  github-draft:
    name: Create or verify GitHub draft without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: write
    outputs:
      release_state: ${{ steps.draft.outputs.release_state }}
    steps:
      - name: Preflight immutable release and create draft with fixed API calls
        id: draft
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          [[ "$RELEASE_TARBALL" =~ ^latchway-client-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null
          unset ADMIN_TOKEN
          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null

          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error.txt"
          status=$?
          set -e
          title="@latchway/client $RELEASE_VERSION"
          if [[ "$status" -ne 0 ]]; then
            test "$status" -eq 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/release-error.txt"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "$title"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          fi
          jq --exit-status --arg tag "$RELEASE_TAG" --arg title "$title" --arg tarball "$RELEASE_TARBALL" '
            .tag_name == $tag and .name == $title and .prerelease == false and
            (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
            ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
            all(.assets[].name;
              . == $tarball or . == "SHA256SUMS" or . == "build-reproducibility.json" or
              . == "contract-evidence.json" or . == "package-evidence.json" or
              . == "post-publish-evidence.json" or . == "publish-input-evidence.json" or
              . == "release-candidate-evidence.json" or . == "tag-evidence.json" or
              . == "npm-registry-version.json" or . == "npm-registry-view.json" or
              . == "npm-attestations.json" or . == "npm-audit-signatures.json" or
              . == "npm-registry-evidence-manifest.json" or
              test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          state=draft
          if [[ "$(jq --raw-output .immutable "$RUNNER_TEMP/release.json")" == true ]]; then state=immutable; fi
          printf 'release_state=%s\n' "$state" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish or adopt npm archive without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, github-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      publish_performed: ${{ steps.registry.outputs.publish_performed }}
    steps:
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install pinned trusted-publishing npm client
        run: npm install --global npm@11.6.2
      - name: Download exact reviewed package without candidate source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/reviewed-release
      - name: Validate reviewed archive identity and checksum with fixed tooling
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TARBALL" = "latchway-client-$RELEASE_VERSION.tgz"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$RELEASE_STATE" == draft || "$RELEASE_STATE" == immutable ]]
          root="$RUNNER_TEMP/reviewed-release"
          archive="$root/$RELEASE_TARBALL"
          test -s "$archive"
          test ! -L "$archive"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .name)" = '@latchway/client'
          test "$(tar -xOzf "$archive" package/package.json | jq --raw-output .version)" = "$RELEASE_VERSION"
          jq --exit-status --arg version "$RELEASE_VERSION" --arg tarball "$RELEASE_TARBALL" \
            --arg sha256 "$EXPECTED_SHA256" --arg integrity "$EXPECTED_INTEGRITY" '
            .schema_version == 1 and .package == "@latchway/client" and .version == $version and
            .tarball == $tarball and .sha256 == $sha256 and .integrity == $integrity
          ' "$root/package-evidence.json" >/dev/null
      - name: Attest reviewed npm package and reproducibility inputs without candidate checkout
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/reviewed-release/${{ needs.verify.outputs.tarball }}
            ${{ runner.temp }}/reviewed-release/package-evidence.json
            ${{ runner.temp }}/reviewed-release/build-reproducibility.json
      - name: Publish or adopt exact npm bytes with fixed commands
        id: registry
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          RELEASE_STATE: ${{ needs.github-draft.outputs.release_state }}
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/reviewed-release"
          archive="$root/$RELEASE_TARBALL"
          metadata="$RUNNER_TEMP/npm-version.json"
          status=$(curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
            --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40latchway%2Fclient/$RELEASE_VERSION")
          publish_performed=false
          if [[ "$status" == 200 ]]; then
            test "$(jq --raw-output .name "$metadata")" = '@latchway/client'
            test "$(jq --raw-output .version "$metadata")" = "$RELEASE_VERSION"
            test "$(jq --raw-output .dist.integrity "$metadata")" = "$EXPECTED_INTEGRITY"
            tarball=$(jq --exit-status --raw-output '.dist.tarball | strings' "$metadata")
            [[ "$tarball" =~ ^https://registry\.npmjs\.org/@latchway/client/-/[A-Za-z0-9._-]+\.tgz$ ]]
            curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
              --fail --silent --show-error --output "$RUNNER_TEMP/existing.tgz" "$tarball"
            cmp --silent "$archive" "$RUNNER_TEMP/existing.tgz"
          else
            test "$status" = 404
            test "$RELEASE_STATE" = draft
            npm publish "$archive" --provenance --access public --registry=https://registry.npmjs.org/
            publish_performed=true
          fi
          printf 'publish_performed=%s\n' "$publish_performed" >> "$GITHUB_OUTPUT"

  publish:
    name: Generate and stage npm registry evidence without OIDC
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, github-draft, npm-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TARBALL: .artifacts/${{ needs.verify.outputs.tarball }}
      RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
    steps:
      - name: Configure isolated npm runtime paths
        shell: bash
        run: |
          printf '%s\n' \
            "NPM_CONFIG_CACHE=$RUNNER_TEMP/latchway-npm-cache" \
            "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/latchway-release.npmrc" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.promote.outputs.commit }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .artifacts
      - name: Prepare tokenless npm OIDC runtime
        run: node scripts/prepare-publish-runtime.mjs
      - name: Re-verify annotated release tag
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: node scripts/verify-release-tag.mjs
      - name: Verify downloaded release artifact
        run: node scripts/verify-release-artifact.mjs
        env:
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_TARBALL: ${{ needs.verify.outputs.tarball }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
      - name: Verify registry integrity, exports, signatures, and provenance
        id: registry_evidence
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.promote.outputs.commit }}
          PUBLISH_PERFORMED: ${{ needs.npm-publish.outputs.publish_performed }}
        run: node scripts/verify-published.mjs
      - name: Stage exact JavaScript release assets for isolated GitHub publication
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/javascript-release-assets"
          mkdir -m 700 "$destination"
          install -m 600 -- \
            "$RELEASE_TARBALL" \
            .artifacts/SHA256SUMS \
            .artifacts/build-reproducibility.json \
            .artifacts/contract-evidence.json \
            .artifacts/package-evidence.json \
            .artifacts/post-publish-evidence.json \
            .artifacts/publish-input-evidence.json \
            .artifacts/release-candidate-evidence.json \
            .artifacts/tag-evidence.json \
            .artifacts/npm-registry-version.json \
            .artifacts/npm-registry-view.json \
            .artifacts/npm-attestations.json \
            .artifacts/npm-audit-signatures.json \
            .artifacts/npm-registry-evidence-manifest.json \
            ".artifacts/${{ steps.registry_evidence.outputs.adoption_asset }}" \
            "$destination/"
      - name: Transfer exact JavaScript assets to the no-checkout publication job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-javascript-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/javascript-release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  github-release-policy:
    name: Re-verify immutable release policy without OIDC or candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
    steps:
      - name: Verify immutable releases remain enforced with the protected admin credential
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          GH_TOKEN="$ADMIN_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            > "$RUNNER_TEMP/immutable-release-settings.json"
          unset ADMIN_TOKEN
          jq --exit-status '
            type == "object" and
            (keys | sort) == ["enabled", "enforced_by_owner"] and
            .enabled == true and
            (.enforced_by_owner | type) == "boolean"
          ' "$RUNNER_TEMP/immutable-release-settings.json" >/dev/null

  github-release:
    name: Publish immutable GitHub release without candidate checkout
    if: github.repository == 'Latchway/latchway-js'
    needs: [promote, verify, publish, github-release-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download exact JavaScript release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-javascript-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/javascript-release-assets
      - name: Validate exact JavaScript asset closure before OIDC attestation
        shell: bash
        env:
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TARBALL" = "latchway-client-$RELEASE_VERSION.tgz"
          asset_root="$RUNNER_TEMP/javascript-release-assets"
          shopt -s nullglob
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 1
          adoption_name=${adoption_assets[0]##*/}
          [[ "$adoption_name" =~ ^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          expected=(
            "$RELEASE_TARBALL"
            SHA256SUMS
            build-reproducibility.json
            contract-evidence.json
            package-evidence.json
            post-publish-evidence.json
            publish-input-evidence.json
            release-candidate-evidence.json
            tag-evidence.json
            npm-registry-version.json
            npm-registry-view.json
            npm-attestations.json
            npm-audit-signatures.json
            npm-registry-evidence-manifest.json
            "$adoption_name"
          )
          actual=("$asset_root"/*)
          test "${#actual[@]}" = "${#expected[@]}"
          for asset in "${actual[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          printf '%s\n' "${actual[@]##*/}" | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          cmp --silent "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Attest exact retained registry and release evidence without candidate checkout
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/javascript-release-assets/*
      - name: Reconcile, publish, and verify immutable release with fixed API calls
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          [[ "$RELEASE_TARBALL" =~ ^latchway-client-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          version_line=$(gh version | head -n 1)
          [[ "$version_line" =~ ^gh[[:space:]]version[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+)([[:space:]]\([^()]+\))?$ ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          (( major > 2 || (major == 2 && (minor > 97 || (minor == 97 && patch >= 0))) ))
          gh release verify --help | grep --fixed-strings -- '--format' >/dev/null
          gh release verify-asset --help | grep --fixed-strings -- '--format' >/dev/null

          export GH_TOKEN="$RELEASE_TOKEN"
          unset RELEASE_TOKEN

          asset_root="$RUNNER_TEMP/javascript-release-assets"
          adoption_assets=("$asset_root"/npm-release-adoption-*.json)
          test "${#adoption_assets[@]}" = 1
          [[ "${adoption_assets[0]##*/}" =~ ^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\.json$ ]]
          fixed_assets=(
            "$asset_root/$RELEASE_TARBALL"
            "$asset_root/SHA256SUMS"
            "$asset_root/build-reproducibility.json"
            "$asset_root/contract-evidence.json"
            "$asset_root/package-evidence.json"
            "$asset_root/post-publish-evidence.json"
            "$asset_root/publish-input-evidence.json"
            "$asset_root/release-candidate-evidence.json"
            "$asset_root/tag-evidence.json"
            "$asset_root/npm-registry-version.json"
            "$asset_root/npm-registry-view.json"
            "$asset_root/npm-attestations.json"
            "$asset_root/npm-audit-signatures.json"
            "$asset_root/npm-registry-evidence-manifest.json"
          )
          : > "$RUNNER_TEMP/fixed-assets.txt"
          for asset in "${fixed_assets[@]}" "${adoption_assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
            test -s "$asset"
          done
          for asset in "${fixed_assets[@]}"; do printf '%s\n' "${asset##*/}" >> "$RUNNER_TEMP/fixed-assets.txt"; done
          test "$(sort -u "$RUNNER_TEMP/fixed-assets.txt" | wc -l | tr -d ' ')" = 14
          fixed_names=$(sort "$RUNNER_TEMP/fixed-assets.txt" | jq --raw-input --slurp 'split("\n")[:-1]')

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null

          lookup_release() {
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          }
          lookup_release
          title="@latchway/client $RELEASE_VERSION"
          validate_release() {
            local allow_draft=$1
            jq --exit-status --arg tag "$RELEASE_TAG" --arg title "$title" \
              --argjson fixed "$fixed_names" --argjson allow_draft "$allow_draft" '
              . as $release |
              .tag_name == $tag and .name == $title and .prerelease == false and
              (.draft | type) == "boolean" and (.immutable | type) == "boolean" and
              ($allow_draft or .draft == false) and
              ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
              ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
              all($release.assets[].name as $name; ($fixed | index($name)) != null or
                ($name | test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$")))
            ' "$RUNNER_TEMP/release.json" >/dev/null
          }
          validate_release true
          verify_or_upload() {
            local asset=$1 name remote_count remote_id remote_size downloaded
            name=${asset##*/}
            remote_count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")
            test "$remote_count" -le 1
            if [[ "$remote_count" -eq 1 ]]; then
              remote_id=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/release.json")
              remote_size=$(jq --raw-output --arg name "$name" '.assets[] | select(.name == $name) | .size' "$RUNNER_TEMP/release.json")
              test "$remote_size" = "$(wc -c < "$asset" | tr -d ' ')"
              downloaded="$RUNNER_TEMP/existing-$name"
              gh api --method GET -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" > "$downloaded"
              cmp --silent "$asset" "$downloaded"
              return
            fi
            test "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" = true
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          }
          for asset in "${fixed_assets[@]}"; do verify_or_upload "$asset"; done
          adoption_name=${adoption_assets[0]##*/}
          if [[ "$(jq --arg name "$adoption_name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")" -eq 1 ||
                "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            verify_or_upload "${adoption_assets[0]}"
          else
            test "$(jq '[.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length' "$RUNNER_TEMP/release.json")" -ge 1
          fi
          lookup_release
          validate_release true
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            ([$release.assets[].name] - $fixed | all(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))) and
            all($fixed[] as $name; ($release.assets | map(.name) | index($name)) != null) and
            ([$release.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length) >= 1
          ' "$RUNNER_TEMP/release.json" >/dev/null
          if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi
          lookup_release
          validate_release false
          jq --exit-status --argjson fixed "$fixed_names" '. as $release |
            all($fixed[] as $name; ($release.assets | map(.name) | index($name)) != null) and
            ([$release.assets[].name | select(test("^npm-release-adoption-[1-9][0-9]*-[1-9][0-9]*\\.json$"))] | length) >= 1
          ' "$RUNNER_TEMP/release.json" >/dev/null

          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-attestation.json"; then verified=true; break; fi
            test "$attempt" = 12 || sleep 10
          done
          test "$verified" = true
          for asset in "${fixed_assets[@]}"; do
            verified=false
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --format json \
                > "$RUNNER_TEMP/${asset##*/}.attestation.json"; then verified=true; break; fi
              test "$attempt" = 12 || sleep 10
            done
            test "$verified" = true
          done
