name: Single-maintainer v1 release

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Explicit lower-assurance publication profile
        required: true
        type: choice
        options:
          - single_maintainer_v1
      release_commit:
        description: Exact 40-character main commit to publish
        required: true
        type: string
      release_version:
        description: Must be 1.0.0
        required: true
        default: 1.0.0
        type: string
      confirmation:
        description: Type publish-v1.0.0-with-deferred-assurance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A failed attempt is resumed only by rerunning this same GitHub run ID.
  group: javascript-single-maintainer-v1
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0
  NPM_VERSION: 11.6.2
  NPM_CLI_SHA256: 585f95094ee5cb2788ee11d90f2a518a7c9ef6e083fa141d0b63ca3383675a20
  RELEASE_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0

jobs:
  intent:
    name: Bind one resumable transaction to exact main source
    if: github.repository == 'Latchway/latchway-js' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      commit: ${{ steps.intent.outputs.commit }}
      core_bundle_sha256: ${{ steps.intent.outputs.core_bundle_sha256 }}
      core_commit: ${{ steps.intent.outputs.core_commit }}
      core_tag: ${{ steps.intent.outputs.core_tag }}
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
      tag: ${{ steps.intent.outputs.tag }}
      transaction_id: ${{ steps.intent.outputs.transaction_id }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - name: Authenticate this exact workflow run and attempt before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ ]]
          (( GITHUB_RUN_ID <= 9007199254740991 ))
          (( GITHUB_RUN_ATTEMPT <= 9007199254740991 ))
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          jq --exit-status --arg commit "$RELEASE_COMMIT" --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              .id == $run and .run_attempt == $attempt and .event == "workflow_dispatch" and
              .status == "in_progress" and .head_sha == $commit and .head_branch == "main" and
              .repository.full_name == "Latchway/latchway-js" and
              .head_repository.full_name == "Latchway/latchway-js" and
              (.workflow_id | type == "number" and . > 0)
            ' "$RUNNER_TEMP/run.json" >/dev/null
          workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow.json"
          jq --exit-status '.path == ".github/workflows/single-maintainer-release.yml" and .state == "active"' \
            "$RUNNER_TEMP/workflow.json" >/dev/null
      - name: Refuse a new dispatch or rerun-all after any v1 mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoints=(
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )
          for index in "${!endpoints[@]}"; do
            set +e
            gh api "${endpoints[$index]}" > "$RUNNER_TEMP/v1-owner-guard-$index.json" \
              2> "$RUNNER_TEMP/v1-owner-guard-$index.err"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "::error::v1.0.0 already has transaction state; recover only with Re-run failed jobs on its owner run"
              exit 1
            fi
            test "$status" = 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/v1-owner-guard-$index.err"
          done
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify explicit single-maintainer request without credentials
        id: intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
          RELEASE_PROFILE_INPUT: ${{ inputs.release_profile }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: >-
          python3 scripts/verify-maintainer-release.py
          --repository-id javascript
          --repository-name "$GITHUB_REPOSITORY"
          --profile "$RELEASE_PROFILE_INPUT"
          --release-commit "$RELEASE_COMMIT_INPUT"
          --release-version "$RELEASE_VERSION_INPUT"
          --workflow-commit "$GITHUB_SHA"
          --workflow-ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --confirmation "$CONFIRMATION"
          --intent-output "$RUNNER_TEMP/latchway-single-maintainer-v1-intent.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Bind attempt artifact name without changing transaction bytes
        id: artifact
        run: printf 'name=javascript-maintainer-intent-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  core-evidence:
    name: Verify exact registry-only public core release with cloud deployments deferred
    needs: intent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      candidate_commit: ${{ steps.core.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Semantically and cryptographically verify the public core release
        id: core
        env:
          CORE_BUNDLE_SHA256: ${{ needs.intent.outputs.core_bundle_sha256 }}
          CORE_CHECKPOINT_COMMIT: ${{ needs.intent.outputs.core_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/core-release"
          bash scripts/verify-public-core-release.sh "$CORE_CHECKPOINT_COMMIT" "$root"
          jq --exit-status --arg checkpoint "$CORE_CHECKPOINT_COMMIT" '
            .locked_commit == $checkpoint and
            .publication_scope == "registry_only" and .cloud_deployments == "deferred"
          ' "$RUNNER_TEMP/verified-core-release.json" >/dev/null
          test "$(sha256sum "$root/latchway-contract.tar.gz" | cut -d ' ' -f 1)" = "$CORE_BUNDLE_SHA256"
          candidate_commit=$(jq --exit-status --raw-output \
            '.candidate_commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/verified-core-release.json")
          ancestry_status=$(jq --exit-status --raw-output \
            '.status | select(. == "ahead" or . == "identical")' "$RUNNER_TEMP/core-ancestry.json")
          merge_base_commit=$(jq --exit-status --raw-output \
            '.merge_base_commit.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/core-ancestry.json")
          test "$merge_base_commit" = "$CORE_CHECKPOINT_COMMIT"
          printf 'candidate_commit=%s\n' "$candidate_commit" >> "$GITHUB_OUTPUT"
          printf 'ancestry_status=%s\n' "$ancestry_status" >> "$GITHUB_OUTPUT"
          printf 'merge_base_commit=%s\n' "$merge_base_commit" >> "$GITHUB_OUTPUT"
      - name: Emit deterministic downstream core gate
        env:
          CORE_BUNDLE_SHA256: ${{ needs.intent.outputs.core_bundle_sha256 }}
          CORE_CANDIDATE_COMMIT: ${{ steps.core.outputs.candidate_commit }}
          CORE_CHECKPOINT_COMMIT: ${{ needs.intent.outputs.core_commit }}
          CORE_ANCESTRY_STATUS: ${{ steps.core.outputs.ancestry_status }}
          CORE_MERGE_BASE_COMMIT: ${{ steps.core.outputs.merge_base_commit }}
          SDK_COMMIT: ${{ needs.intent.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/core-release"
          assets='{}'
          while IFS= read -r name; do
            digest=$(sha256sum "$root/$name" | cut -d ' ' -f 1)
            assets=$(jq --compact-output --null-input --argjson current "$assets" --arg name "$name" --arg digest "$digest" \
              '$current + {($name): $digest}')
          done < <(find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "$(jq 'length' <<< "$assets")" = 11
          jq --null-input --arg candidate "$CORE_CANDIDATE_COMMIT" \
            --arg checkpoint "$CORE_CHECKPOINT_COMMIT" --arg ancestry "$CORE_ANCESTRY_STATUS" \
            --arg merge_base "$CORE_MERGE_BASE_COMMIT" --arg bundle "$CORE_BUNDLE_SHA256" \
            --arg sdk_commit "$SDK_COMMIT" \
            --arg record_sha256 "$(sha256sum "$root/latchway-single-maintainer-v1.json" | cut -d ' ' -f 1)" \
            --argjson assets "$assets" --slurpfile record "$root/latchway-single-maintainer-v1.json" '
              {
                schema_version:1,
                kind:"latchway_javascript_core_single_maintainer_v1_gate",
                status:"passed",
                repository:"Latchway/latchway",
                tag:"v1.0.0",
                contract_checkpoint_commit:$checkpoint,
                candidate_commit:$candidate,
                ancestry:{status:$ancestry,merge_base_commit:$merge_base},
                contract_bundle_sha256:$bundle,
                profile:$record[0].profile,
                profile_status:$record[0].profile_status,
                publication_scope:"registry_only",
                core_publication_gate:$record[0].core_publication_gate,
                image:$record[0].image,
                deployment_evidence:$record[0].deployment_evidence,
                deferred_evidence:$record[0].deferred_evidence,
                supply_chain:$record[0].supply_chain,
                claims:$record[0].claims,
                public_release:{draft:false,prerelease:false,asset_count:11},
                verification:{
                  semantic_candidate_commit:$candidate,
                  sdk_semantic_verifier_commit:$sdk_commit,
                  core_public_record_attestation:true,
                  sha256sums_attestation:true,
                  candidate_attestation:true,
                  deployment_evidence_absent:true,
                  cloud_deployments_deferred:true,
                  core_record_sha256:$record_sha256,
                  release_asset_sha256:$assets
                }
              }
            ' > "$RUNNER_TEMP/core-release-gate.json"
      - name: Bind verified core gate to this attempt
        id: artifact
        run: printf 'name=javascript-core-release-gate-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/core-release-gate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    name: Run complete deterministic JavaScript release gate
    needs: [intent, core-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Scan exact dependency inventory
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: .artifacts/dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - run: pnpm release:check
      - name: Build deterministic documentation bundle
        run: >-
          python3 scripts/build_docs_bundle.py --output-dir .artifacts
          --version "$RELEASE_VERSION" --commit "${{ needs.intent.outputs.commit }}"
          --require-clean
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.intent.outputs.artifact_name }}
          path: ${{ runner.temp }}/maintainer-intent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.core-evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/core-gate
      - name: Revalidate and stage transaction and core gate records
        env:
          CORE_BUNDLE_SHA256: ${{ needs.intent.outputs.core_bundle_sha256 }}
          CORE_CANDIDATE_COMMIT: ${{ needs.core-evidence.outputs.candidate_commit }}
          CORE_CHECKPOINT_COMMIT: ${{ needs.intent.outputs.core_commit }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          TRANSACTION_ID: ${{ needs.intent.outputs.transaction_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          intent="$RUNNER_TEMP/maintainer-intent/latchway-single-maintainer-v1-intent.json"
          gate="$RUNNER_TEMP/core-gate/core-release-gate.json"
          printf '%s  %s\n' "$INTENT_SHA256" "$intent" | sha256sum --check --strict
          jq --exit-status --arg transaction "$TRANSACTION_ID" --argjson owner "$GITHUB_RUN_ID" '
            .profile == "single_maintainer_v1" and .publication_ready == false and
            .release_qualified == false and .transaction.id == $transaction and
            .transaction.owner_run_id == $owner and .workflow.owner_run_id == $owner
          ' "$intent" >/dev/null
          jq --exit-status --arg candidate "$CORE_CANDIDATE_COMMIT" \
            --arg checkpoint "$CORE_CHECKPOINT_COMMIT" --arg bundle "$CORE_BUNDLE_SHA256" '
            .schema_version == 1 and .kind == "latchway_javascript_core_single_maintainer_v1_gate" and
            .status == "passed" and .repository == "Latchway/latchway" and .tag == "v1.0.0" and
            .contract_checkpoint_commit == $checkpoint and .candidate_commit == $candidate and
            (.candidate_commit | test("^[0-9a-f]{40}$")) and
            (.ancestry.status == "ahead" or .ancestry.status == "identical") and
            .ancestry.merge_base_commit == $checkpoint and .contract_bundle_sha256 == $bundle and
            .profile == "single_maintainer_v1" and .profile_status == "incomplete" and
            .publication_scope == "registry_only" and
            .core_publication_gate == "passed" and
            .deployment_evidence == {} and
            .deferred_evidence == [
              "independent_human_review",
              "live_sdk_conformance",
              "physical_devices",
              "apple_distribution_and_extensions",
              "play_integrity_and_android_device",
              "firebase_app_check",
              "turnstile",
              "live_provider",
              "cloud_deployments",
              "operational_resilience",
              "public_registries.documentation_production_verified",
              "mintlify_production"
            ] and
            .verification.semantic_candidate_commit == $candidate and
            .verification.core_public_record_attestation == true and
            .verification.sha256sums_attestation == true and
            .verification.candidate_attestation == true and
            .verification.deployment_evidence_absent == true and
            .verification.cloud_deployments_deferred == true and
            .claims == {fully_evidence_gated:false,independently_reviewed:false,release_qualified:false}
          ' "$gate" >/dev/null
          install -m 600 "$intent" .artifacts/
          install -m 600 "$gate" .artifacts/
      - name: Bind deterministic release inputs to this attempt
        id: artifact
        run: printf 'name=javascript-single-maintainer-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            .artifacts/latchway-client-1.0.0.tgz
            .artifacts/latchway-openai-1.0.0.tgz
            .artifacts/latchway-vercel-ai-1.0.0.tgz
            .artifacts/latchway-langchain-1.0.0.tgz
            .artifacts/docs-bundle-1.0.0.tar.gz
            .artifacts/SHA256SUMS
            .artifacts/build-reproducibility.json
            .artifacts/contract-evidence.json
            .artifacts/core-release-gate.json
            .artifacts/dependency-vulnerability-scan.json
            .artifacts/package-evidence.json
            .artifacts/release-candidate-evidence.json
            .artifacts/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  tag:
    name: Create or adopt only transaction-owned annotated tag
    needs: [intent, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: single-maintainer-v1
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require exact single-maintainer-v1 environment policy sentinel
        shell: bash
        env:
          EXPECTED_POLICY_ID: latchway-release-controls-v1:latchway-js:single-maintainer-v1
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "$EXPECTED_POLICY_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.intent.outputs.artifact_name }}
          path: ${{ runner.temp }}/intent
      - name: Create or adopt only same-run transaction tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          TRANSACTION_ID: ${{ needs.intent.outputs.transaction_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          intent="$RUNNER_TEMP/intent/latchway-single-maintainer-v1-intent.json"
          message=$(jq --exit-status --raw-output .github_release.tag_message "$intent")
          jq --exit-status --arg transaction "$TRANSACTION_ID" --argjson owner "$GITHUB_RUN_ID" '
            .transaction.id == $transaction and .transaction.owner_run_id == $owner
          ' "$intent" >/dev/null
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json" 2> "$RUNNER_TEMP/ref.err"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            test "$status" = 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/ref.err"
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" --arg object "$RELEASE_COMMIT" \
              '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/tag.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" > "$RUNNER_TEMP/tag-result.json"
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" \
              --arg sha "$(jq -r .sha "$RUNNER_TEMP/tag-result.json")" '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/create-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/create-ref.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json"
          fi
          test "$(jq -r .object.type "$RUNNER_TEMP/ref.json")" = tag
          tag_object=$(jq --exit-status --raw-output '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" '
            .tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/tag-object.json" >/dev/null

  stage-release:
    name: Stage or adopt exact recoverable transaction draft
    needs: [intent, verify, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: single-maintainer-v1
    permissions:
      actions: read
      contents: write
    outputs:
      release_state: ${{ steps.stage.outputs.release_state }}
    steps:
      - name: Require exact single-maintainer-v1 environment policy sentinel
        shell: bash
        env:
          EXPECTED_POLICY_ID: latchway-release-controls-v1:latchway-js:single-maintainer-v1
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "$EXPECTED_POLICY_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Create or resume same-run draft and byte-verify every input asset
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          TRANSACTION_ID: ${{ needs.intent.outputs.transaction_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/release"
          intent="$root/latchway-single-maintainer-v1-intent.json"
          title=$(jq --exit-status --raw-output .github_release.title "$intent")
          body=$(jq --exit-status --raw-output .github_release.body "$intent")
          jq --exit-status --arg transaction "$TRANSACTION_ID" --argjson owner "$GITHUB_RUN_ID" '
            .transaction.id == $transaction and .transaction.owner_run_id == $owner
          ' "$intent" >/dev/null
          printf '%s\n' \
            SHA256SUMS build-reproducibility.json contract-evidence.json core-release-gate.json \
            dependency-vulnerability-scan.json docs-bundle-1.0.0.tar.gz \
            latchway-client-1.0.0.tgz latchway-langchain-1.0.0.tgz \
            latchway-openai-1.0.0.tgz latchway-single-maintainer-v1-intent.json \
            latchway-vercel-ai-1.0.0.tgz package-evidence.json release-candidate-evidence.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/base-assets"
          find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-base-assets"
          diff --unified=0 "$RUNNER_TEMP/base-assets" "$RUNNER_TEMP/actual-base-assets"
          test -z "$(find "$root" -type l -print -quit)"
          printf '%s\n' \
            npm-client-attestations.json npm-client-audit-signatures.json npm-client-registry-version.json npm-client-registry-view.json \
            npm-langchain-attestations.json npm-langchain-audit-signatures.json npm-langchain-registry-version.json npm-langchain-registry-view.json \
            npm-openai-attestations.json npm-openai-audit-signatures.json npm-openai-registry-version.json npm-openai-registry-view.json \
            npm-vercel-ai-attestations.json npm-vercel-ai-audit-signatures.json npm-vercel-ai-registry-version.json npm-vercel-ai-registry-view.json \
            npm-registry-evidence-manifest.json post-publish-evidence.json single-maintainer-npm-adoption.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/registry-assets"
          cat "$RUNNER_TEMP/base-assets" "$RUNNER_TEMP/registry-assets" | LC_ALL=C sort > "$RUNNER_TEMP/final-assets"
          set +e
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            test "$status" = 1
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/release.err"
            jq --null-input --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
              --arg title "$title" --arg body "$body" \
              '{tag_name:$tag,target_commitish:$commit,name:$title,body:$body,draft:true,prerelease:false,generate_release_notes:false}' \
              > "$RUNNER_TEMP/create-release.json"
            gh api --method POST -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/create-release.json" >/dev/null
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          fi
          jq --exit-status --arg tag "$RELEASE_TAG" --arg title "$title" --arg body "$body" '
            .tag_name == $tag and .name == $title and .body == $body and
            .prerelease == false and (.draft == true or .draft == false)
          ' "$RUNNER_TEMP/release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" | while IFS= read -r name; do
            grep --fixed-strings --line-regexp --quiet "$name" "$RUNNER_TEMP/final-assets"
          done
          verify_asset() {
            local name="$1" expected observed download
            expected="sha256:$(sha256sum "$root/$name" | cut -d ' ' -f 1)"
            observed=$(jq --exit-status --raw-output --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then (.[0].digest // "digest-unavailable") else error("asset closure") end' \
              "$RUNNER_TEMP/release.json")
            if [[ "$observed" == digest-unavailable ]]; then
              download=$(mktemp -d "$RUNNER_TEMP/staged-asset.XXXXXX")
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$download" \
                --repo "$GITHUB_REPOSITORY"
              cmp --silent "$root/$name" "$download/$name"
            else
              test "$observed" = "$expected"
            fi
          }
          while IFS= read -r name; do
            count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")
            if [[ "$count" = 0 ]]; then
              test "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" = true
              gh release upload "$RELEASE_TAG" "$root/$name" --repo "$GITHUB_REPOSITORY"
            else
              test "$count" = 1
              verify_asset "$name"
            fi
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
            verify_asset "$name"
          done < "$RUNNER_TEMP/base-assets"
          if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" == false ]]; then
            test "$(jq '.assets | length' "$RUNNER_TEMP/release.json")" = 32
          fi
          printf 'release_state=%s\n' "$(jq --raw-output 'if .draft then "draft" else "published" end' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish missing npm versions with trusted provenance
    needs: [intent, verify, stage-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: single-maintainer-v1
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      producer_run_attempt: ${{ steps.registry.outputs.producer_run_attempt }}
      producer_run_id: ${{ steps.registry.outputs.producer_run_id }}
      publish_state: ${{ steps.registry.outputs.publish_state }}
    steps:
      - name: Require exact single-maintainer-v1 environment policy sentinel
        shell: bash
        env:
          EXPECTED_POLICY_ID: latchway-release-controls-v1:latchway-js:single-maintainer-v1
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "$EXPECTED_POLICY_ID"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install hash-pinned trusted-publishing npm CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --max-filesize 4194304 \
            --output "$archive" "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum --check --strict
          mkdir -m 700 "$RUNNER_TEMP/npm-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/npm-cli" --no-same-owner --no-same-permissions
          cli="$RUNNER_TEMP/npm-cli/package/bin/npm-cli.js"
          test "$("$cli" --version)" = "$NPM_VERSION"
          printf 'LATCHWAY_NPM_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Attest exact deterministic archives before npm mutation
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release/latchway-*-1.0.0.tgz
      - name: Publish missing bytes and defer adoption claim to provenance verifier
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          RELEASE_STATE: ${{ needs.stage-release.outputs.release_state }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          names=('@latchway/client' '@latchway/openai' '@latchway/vercel-ai' '@latchway/langchain')
          ids=(client openai vercel-ai langchain)
          registry_paths=('%40latchway%2Fclient' '%40latchway%2Fopenai' '%40latchway%2Fvercel-ai' '%40latchway%2Flangchain')
          files=(latchway-client-1.0.0.tgz latchway-openai-1.0.0.tgz latchway-vercel-ai-1.0.0.tgz latchway-langchain-1.0.0.tgz)
          publish_required=()
          root="$RUNNER_TEMP/release"
          for index in "${!names[@]}"; do
            name=${names[$index]}; archive="$root/${files[$index]}"; metadata="$RUNNER_TEMP/${ids[$index]}-version.json"
            integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
            shasum=$(sha1sum "$archive" | cut -d ' ' -f 1)
            status=$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
              --max-filesize 2097152 --silent --show-error --output "$metadata" --write-out '%{http_code}' \
              "https://registry.npmjs.org/${registry_paths[$index]}/1.0.0")
            if [[ "$status" == 200 ]]; then
              jq --exit-status --arg name "$name" --arg integrity "$integrity" --arg shasum "$shasum" '
                .name == $name and .version == "1.0.0" and .dist.integrity == $integrity and .dist.shasum == $shasum and
                ((.repository | if type == "object" then .url else . end) | sub("^git\\+"; "") | sub("\\.git$"; "")) == "https://github.com/Latchway/latchway-js"
              ' "$metadata" >/dev/null
              url=$(jq --exit-status --raw-output '.dist.tarball | select(startswith("https://registry.npmjs.org/"))' "$metadata")
              curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --max-filesize 20971520 \
                --output "$RUNNER_TEMP/existing-${ids[$index]}.tgz" "$url"
              cmp --silent "$archive" "$RUNNER_TEMP/existing-${ids[$index]}.tgz"
              publish_required[$index]=false
            else
              test "$status" = 404
              test "$RELEASE_STATE" = draft
              publish_required[$index]=true
            fi
          done
          publish_state='{}'
          for index in "${!names[@]}"; do
            name=${names[$index]}; archive="$root/${files[$index]}"; performed=false
            if [[ "${publish_required[$index]}" == true ]]; then
              gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/npm-release-guard.json"
              jq --exit-status '.tag_name == "v1.0.0" and .draft == true and .prerelease == false' \
                "$RUNNER_TEMP/npm-release-guard.json" >/dev/null
              "$LATCHWAY_NPM_CLI" publish "$archive" --access public --provenance --tag latest --ignore-scripts \
                --registry=https://registry.npmjs.org/ --@latchway:registry=https://registry.npmjs.org/
              performed=true
            fi
            publish_state=$(jq --compact-output --null-input --argjson current "$publish_state" \
              --arg name "$name" --argjson performed "$performed" '$current + {($name): $performed}')
          done
          printf 'publish_state=%s\n' "$publish_state" >> "$GITHUB_OUTPUT"
          printf 'producer_run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'producer_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  registry-evidence:
    name: Verify registry bytes signatures and exact publisher provenance
    needs: [intent, verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: single-maintainer-v1
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Require exact single-maintainer-v1 environment policy sentinel
        shell: bash
        env:
          EXPECTED_POLICY_ID: latchway-release-controls-v1:latchway-js:single-maintainer-v1
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "$EXPECTED_POLICY_ID"
      - name: Configure isolated npm verification paths
        shell: bash
        run: |
          printf '%s\n' \
            "NPM_CONFIG_CACHE=$RUNNER_TEMP/latchway-npm-cache" \
            "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/latchway-release.npmrc" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .artifacts
      - name: Prepare isolated tokenless registry verification
        run: node scripts/prepare-verification-runtime.mjs
      - name: Verify npm bytes signatures attestations repository workflow and commit
        env:
          EXPECTED_PROVENANCE_EVENT: workflow_dispatch
          EXPECTED_PROVENANCE_WORKFLOW_PATH: .github/workflows/single-maintainer-release.yml
          EXPECTED_RELEASE_TAG: ${{ needs.intent.outputs.tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
          PUBLISH_PRODUCER_RUN_ATTEMPT: ${{ needs.publish.outputs.producer_run_attempt }}
          PUBLISH_PRODUCER_RUN_ID: ${{ needs.publish.outputs.producer_run_id }}
          PUBLISH_STATE_JSON: ${{ needs.publish.outputs.publish_state }}
        run: node scripts/verify-published.mjs
      - name: Build stable same-run adoption summary and exact evidence closure
        env:
          TRANSACTION_ID: ${{ needs.intent.outputs.transaction_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root=.artifacts
          jq --exit-status --arg commit "${{ needs.intent.outputs.commit }}" '
            .schema_version == 3 and .kind == "latchway_npm_package_set_publication_evidence" and
            .source == {repository:"https://github.com/Latchway/latchway-js",commit:$commit,workflow:".github/workflows/single-maintainer-release.yml",ref:"refs/heads/main"} and
            .release_tag == "v1.0.0" and .package_count == 4 and
            all(.packages[];
              .trusted_publisher.provider == "github" and
              .trusted_publisher.provenance_predicate_type == "https://slsa.dev/provenance/v1" and
              (.trusted_publisher.provenance_origin.run_id | type) == "number" and
              (.trusted_publisher.provenance_origin.run_attempt | type) == "number")
          ' "$root/post-publish-evidence.json" >/dev/null
          jq --arg transaction "$TRANSACTION_ID" --argjson owner "$GITHUB_RUN_ID" '
            {
              schema_version:1,
              kind:"latchway_single_maintainer_npm_adoption",
              transaction:{id:$transaction,owner_repository:"Latchway/latchway-js",owner_workflow:".github/workflows/single-maintainer-release.yml",owner_run_id:$owner},
              source:.source,
              release_tag:.release_tag,
              packages:[.packages[] | {
                package,version,tarball,
                provenance:.trusted_publisher.provenance_origin,
                mode:(if .trusted_publisher.provenance_origin.run_id == $owner then "transaction_publication" else "verified_existing" end),
                attestation:.trusted_publisher.sigstore_bundle,
                signature_verification:.registry_signature_verification.output
              }]
            }
          ' "$root/post-publish-evidence.json" > "$root/single-maintainer-npm-adoption.json"
          destination="$RUNNER_TEMP/registry-evidence"
          mkdir -m 700 "$destination"
          fixed=(
            npm-client-attestations.json npm-client-audit-signatures.json npm-client-registry-version.json npm-client-registry-view.json
            npm-langchain-attestations.json npm-langchain-audit-signatures.json npm-langchain-registry-version.json npm-langchain-registry-view.json
            npm-openai-attestations.json npm-openai-audit-signatures.json npm-openai-registry-version.json npm-openai-registry-view.json
            npm-vercel-ai-attestations.json npm-vercel-ai-audit-signatures.json npm-vercel-ai-registry-version.json npm-vercel-ai-registry-view.json
            npm-registry-evidence-manifest.json post-publish-evidence.json single-maintainer-npm-adoption.json
          )
          for name in "${fixed[@]}"; do install -m 600 "$root/$name" "$destination/$name"; done
          test "$(find "$destination" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 19
          test -z "$(find "$destination" -type l -print -quit)"
      - name: Bind verified registry evidence to this attempt
        id: artifact
        run: printf 'name=javascript-single-maintainer-registry-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/registry-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  github-release:
    name: Byte-close attest and finalize exact transaction release
    needs: [intent, verify, stage-release, registry-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: single-maintainer-v1
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require exact single-maintainer-v1 environment policy sentinel
        shell: bash
        env:
          EXPECTED_POLICY_ID: latchway-release-controls-v1:latchway-js:single-maintainer-v1
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: |
          set -Eeuo pipefail
          test "$OBSERVED_POLICY_ID" = "$EXPECTED_POLICY_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release/base
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.registry-evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/release/registry
      - name: Validate exact final closure before OIDC attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/release"
          printf '%s\n' \
            SHA256SUMS build-reproducibility.json contract-evidence.json core-release-gate.json \
            dependency-vulnerability-scan.json docs-bundle-1.0.0.tar.gz \
            latchway-client-1.0.0.tgz latchway-langchain-1.0.0.tgz \
            latchway-openai-1.0.0.tgz latchway-single-maintainer-v1-intent.json \
            latchway-vercel-ai-1.0.0.tgz package-evidence.json release-candidate-evidence.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-base-assets"
          printf '%s\n' \
            npm-client-attestations.json npm-client-audit-signatures.json npm-client-registry-version.json npm-client-registry-view.json \
            npm-langchain-attestations.json npm-langchain-audit-signatures.json npm-langchain-registry-version.json npm-langchain-registry-view.json \
            npm-openai-attestations.json npm-openai-audit-signatures.json npm-openai-registry-version.json npm-openai-registry-view.json \
            npm-vercel-ai-attestations.json npm-vercel-ai-audit-signatures.json npm-vercel-ai-registry-version.json npm-vercel-ai-registry-view.json \
            npm-registry-evidence-manifest.json post-publish-evidence.json single-maintainer-npm-adoption.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-registry-assets"
          find "$root/base" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/observed-base-assets"
          find "$root/registry" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/observed-registry-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-base-assets" "$RUNNER_TEMP/observed-base-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-registry-assets" "$RUNNER_TEMP/observed-registry-assets"
          test -z "$(find "$root/base" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$root/registry" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$root" -mindepth 3 -print -quit)"
          cat "$RUNNER_TEMP/expected-base-assets" "$RUNNER_TEMP/expected-registry-assets" \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          test "$(wc -l < "$RUNNER_TEMP/expected-release-assets" | tr -d ' ')" = 32
          test -z "$(uniq -d "$RUNNER_TEMP/expected-release-assets")"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -mindepth 2 -maxdepth 2 -type f | wc -l | tr -d ' ')" = 32
      - name: Attest every exact base and registry evidence asset
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/release/base/*
            ${{ runner.temp }}/release/registry/*
      - name: Upload or adopt exact bytes then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          TRANSACTION_ID: ${{ needs.intent.outputs.transaction_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          root="$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/expected-release-assets"
          test ! -L "$RUNNER_TEMP/expected-release-assets"
          test "$(wc -l < "$RUNNER_TEMP/expected-release-assets" | tr -d ' ')" = 32
          asset_path() {
            local name="$1"
            if [[ -f "$root/base/$name" && ! -e "$root/registry/$name" ]]; then
              printf '%s\n' "$root/base/$name"
            elif [[ -f "$root/registry/$name" && ! -e "$root/base/$name" ]]; then
              printf '%s\n' "$root/registry/$name"
            else
              echo "release asset path is missing or ambiguous: $name" >&2
              return 1
            fi
          }
          while IFS= read -r name; do asset_path "$name" >/dev/null; done < "$RUNNER_TEMP/expected-release-assets"
          intent="$root/base/latchway-single-maintainer-v1-intent.json"
          title=$(jq --exit-status --raw-output .github_release.title "$intent")
          body=$(jq --exit-status --raw-output .github_release.body "$intent")
          message=$(jq --exit-status --raw-output .github_release.tag_message "$intent")
          jq --exit-status --arg transaction "$TRANSACTION_ID" --argjson owner "$GITHUB_RUN_ID" --arg commit "$RELEASE_COMMIT" '
            .transaction.id == $transaction and .transaction.owner_run_id == $owner and .source.commit == $commit
          ' "$intent" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/initial-tag-ref.json"
          jq --exit-status --arg ref "refs/tags/$RELEASE_TAG" '
            .ref == $ref and .object.type == "tag" and
            (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/initial-tag-ref.json" >/dev/null
          tag_object=$(jq --raw-output .object.sha "$RUNNER_TEMP/initial-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/final-tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" '
            .tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message
          ' "$RUNNER_TEMP/final-tag-object.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          release_id=$(jq --exit-status --raw-output '.id | select(type == "number" and . > 0 and floor == .)' "$RUNNER_TEMP/release.json")
          test -n "$release_id"
          jq --exit-status --argjson id "$release_id" --arg tag "$RELEASE_TAG" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == $tag and .name == $title and .body == $body and
            .prerelease == false and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true))
          ' "$RUNNER_TEMP/release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" | while IFS= read -r name; do
            grep --fixed-strings --line-regexp --quiet "$name" "$RUNNER_TEMP/expected-release-assets"
          done
          verify_asset_bytes() {
            local name="$1" asset expected observed download
            asset=$(asset_path "$name")
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            observed=$(jq --exit-status --raw-output --arg name "$name" \
              '[.assets[] | select(.name == $name)] | if length == 1 then (.[0].digest // "digest-unavailable") else error("asset closure") end' \
              "$RUNNER_TEMP/release.json")
            if [[ "$observed" == digest-unavailable ]]; then
              download=$(mktemp -d "$RUNNER_TEMP/final-asset.XXXXXX")
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$download" \
                --repo "$GITHUB_REPOSITORY"
              cmp --silent "$asset" "$download/$name"
            else
              test "$observed" = "$expected"
            fi
          }
          while IFS= read -r name; do
            count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")
            if [[ "$count" = 0 ]]; then
              test "$(jq --raw-output .draft "$RUNNER_TEMP/release.json")" = true
              test "$(jq --raw-output .immutable "$RUNNER_TEMP/release.json")" = false
              asset=$(asset_path "$name")
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            else
              test "$count" = 1
              verify_asset_bytes "$name"
            fi
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
            jq --exit-status --argjson id "$release_id" --arg tag "$RELEASE_TAG" --arg title "$title" --arg body "$body" '
              .id == $id and .tag_name == $tag and .name == $title and .body == $body and
              .prerelease == false and
              ((.draft == true and .immutable == false) or
               (.draft == false and .immutable == true))
            ' "$RUNNER_TEMP/release.json" >/dev/null
            verify_asset_bytes "$name"
          done < "$RUNNER_TEMP/expected-release-assets"

          # Reclose both the annotated tag and the complete release under one
          # ETag immediately before the only publication mutation.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/pre-publish-tag-ref.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/initial-tag-ref.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/pre-publish-tag-ref.json")
          gh api --include -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/pre-publish-release.http"
          head -n 1 "$RUNNER_TEMP/pre-publish-release.http" \
            | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 200( |$)'
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (body) print $0
              else if (line == "") body=1
            }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/pre-publish-release.json"
          awk '
            {
              line=$0
              sub(/\r$/, "", line)
              if (tolower(line) ~ /^etag:[[:space:]]*/) {
                sub(/^[^:]+:[[:space:]]*/, "", line)
                print line
              }
            }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/pre-publish-release.etag"
          test "$(wc -l < "$RUNNER_TEMP/pre-publish-release.etag" | tr -d ' ')" = 1
          grep --extended-regexp --quiet '^(W/)?"[^"]+"$' "$RUNNER_TEMP/pre-publish-release.etag"
          release_mode=$(jq --raw-output '
            if .draft == true and .immutable == false then "draft"
            elif .draft == false and .immutable == true then "immutable"
            else "invalid" end
          ' "$RUNNER_TEMP/pre-publish-release.json")
          case "$release_mode" in
            draft|immutable) ;;
            *) echo "invalid immutable-release preflight mode" >&2; exit 1 ;;
          esac
          jq --exit-status --argjson id "$release_id" --arg tag "$RELEASE_TAG" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == $tag and .name == $title and .body == $body and
            .prerelease == false and
            ((.draft == true and .immutable == false) or
             (.draft == false and .immutable == true))
          ' "$RUNNER_TEMP/pre-publish-release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/pre-publish-release.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/pre-publish-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/pre-publish-assets"
          while IFS= read -r name; do
            asset=$(asset_path "$name")
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            observed=$(jq --exit-status --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("pre-publication JavaScript asset missing or duplicated") end
            ' "$RUNNER_TEMP/pre-publish-release.json")
            test "$observed" = "$expected"
          done < "$RUNNER_TEMP/expected-release-assets"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/pre-patch-tag-ref.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/initial-tag-ref.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/pre-patch-tag-ref.json")

          if [[ "$release_mode" == draft ]]; then
            jq --null-input '{draft:false}' > "$RUNNER_TEMP/publish.json"
            gh api --include -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "If-None-Match: $(cat "$RUNNER_TEMP/pre-publish-release.etag")" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/pre-publish-release-unchanged.http"
            head -n 1 "$RUNNER_TEMP/pre-publish-release-unchanged.http" \
              | tr -d '\r' | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 304( |$)'
            gh api --method PATCH -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/published-response.json"
          fi
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published.json"
          jq --exit-status --argjson id "$release_id" --arg tag "$RELEASE_TAG" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == $tag and .name == $title and .body == $body and
            .draft == false and .prerelease == false and .immutable == true
          ' "$RUNNER_TEMP/published.json" >/dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/published-by-id.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/published.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/published-by-id.json")
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/published.json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/published-assets"
          diff --unified=0 "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/published-assets"
          while IFS= read -r name; do
            asset=$(asset_path "$name")
            expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            observed=$(jq --exit-status --raw-output --arg name "$name" '
              [.assets[] | select(.name == $name)] |
              if length == 1 then (.[0].digest // "digest-unavailable")
              else error("immutable JavaScript asset missing or duplicated") end
            ' "$RUNNER_TEMP/published.json")
            test "$observed" = "$expected"
            gh release verify-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-asset-$name.verification.json"
            test -s "$RUNNER_TEMP/release-asset-$name.verification.json"
          done < "$RUNNER_TEMP/expected-release-assets"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json \
            > "$RUNNER_TEMP/release-attestation.json"
          test -s "$RUNNER_TEMP/release-attestation.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/post-publish-tag-ref.json"
          cmp --silent \
            <(jq --sort-keys . "$RUNNER_TEMP/initial-tag-ref.json") \
            <(jq --sort-keys . "$RUNNER_TEMP/post-publish-tag-ref.json")
