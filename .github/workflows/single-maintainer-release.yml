name: Single-maintainer v1 release

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Explicit lower-assurance publication profile
        required: true
        type: choice
        options:
          - single_maintainer_v1
      release_commit:
        description: Exact 40-character main commit to publish
        required: true
        type: string
      release_version:
        description: Must be 1.0.0
        required: true
        default: 1.0.0
        type: string
      confirmation:
        description: Type publish-v1.0.0-with-deferred-assurance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: javascript-single-maintainer-v1-${{ inputs.release_commit }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.15.0
  NPM_VERSION: 11.6.2
  NPM_CLI_SHA256: 585f95094ee5cb2788ee11d90f2a518a7c9ef6e083fa141d0b63ca3383675a20
  RELEASE_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0

jobs:
  intent:
    name: Bind explicit deferred-assurance intent to exact main source
    if: github.repository == 'Latchway/latchway-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.intent.outputs.commit }}
      core_tag: ${{ steps.intent.outputs.core_tag }}
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
      tag: ${{ steps.intent.outputs.tag }}
      version: ${{ steps.intent.outputs.version }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify explicit single-maintainer request without credentials
        id: intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python3 scripts/verify-maintainer-release.py
          --repository-id javascript
          --repository-name "$GITHUB_REPOSITORY"
          --profile "${{ inputs.release_profile }}"
          --release-commit "${{ inputs.release_commit }}"
          --release-version "${{ inputs.release_version }}"
          --workflow-commit "$GITHUB_SHA"
          --workflow-ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --confirmation "$CONFIRMATION"
          --intent-output "$RUNNER_TEMP/latchway-single-maintainer-v1-intent.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Bind intent artifact to this attempt
        id: artifact
        run: printf 'name=javascript-maintainer-intent-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  tag:
    name: Create or verify exact annotated deferred-assurance tag
    needs: [intent, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: single-maintainer-v1
    permissions:
      contents: write
    steps:
      - name: Create or adopt only the exact annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          message="Latchway JavaScript SDKs v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json" 2> "$RUNNER_TEMP/ref.err"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/ref.err"
            jq -n --arg tag "$RELEASE_TAG" --arg message "$message" --arg object "$RELEASE_COMMIT" \
              '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/tag.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" > "$RUNNER_TEMP/tag-result.json"
            jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$(jq -r .sha "$RUNNER_TEMP/tag-result.json")" \
              '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/create-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/create-ref.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json"
          fi
          tag_object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/ref.json")
          test "$(jq -r .object.type "$RUNNER_TEMP/ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag==$tag and .object.type=="commit" and .object.sha==$commit and .message==$message' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null

  verify:
    name: Run complete deterministic JavaScript release gate
    needs: intent
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Scan exact dependency inventory
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: .artifacts/dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - run: pnpm release:check
      - name: Build deterministic documentation bundle
        run: >-
          python3 scripts/build_docs_bundle.py --output-dir .artifacts
          --version "$RELEASE_VERSION" --commit "${{ needs.intent.outputs.commit }}"
          --require-clean
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.intent.outputs.artifact_name }}
          path: .artifacts/maintainer-intent
      - name: Verify intent hash and stage it with release assets
        env:
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          printf '%s  %s\n' "$INTENT_SHA256" .artifacts/maintainer-intent/latchway-single-maintainer-v1-intent.json | sha256sum -c --strict
          install -m 600 .artifacts/maintainer-intent/latchway-single-maintainer-v1-intent.json .artifacts/
      - name: Bind release artifact to this attempt
        id: artifact
        run: printf 'name=javascript-single-maintainer-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            .artifacts/latchway-client-1.0.0.tgz
            .artifacts/latchway-openai-1.0.0.tgz
            .artifacts/latchway-vercel-ai-1.0.0.tgz
            .artifacts/latchway-langchain-1.0.0.tgz
            .artifacts/docs-bundle-1.0.0.tar.gz
            .artifacts/SHA256SUMS
            .artifacts/build-reproducibility.json
            .artifacts/contract-evidence.json
            .artifacts/dependency-vulnerability-scan.json
            .artifacts/package-evidence.json
            .artifacts/release-candidate-evidence.json
            .artifacts/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Trusted npm publication with provenance and byte adoption
    needs: [intent, verify, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: single-maintainer-v1
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install the hash-pinned trusted-publishing npm CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
          curl --proto '=https' --tlsv1.2 --fail --location --max-filesize 4194304 \
            --output "$archive" "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz"
          printf '%s  %s\n' "$NPM_CLI_SHA256" "$archive" | sha256sum -c --strict
          mkdir -m 700 "$RUNNER_TEMP/npm-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/npm-cli" --no-same-owner --no-same-permissions
          cli="$RUNNER_TEMP/npm-cli/package/bin/npm-cli.js"
          test "$("$cli" --version)" = "$NPM_VERSION"
          printf 'LATCHWAY_NPM_CLI=%s\n' "$cli" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Attest exact deterministic archives
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release/latchway-*-1.0.0.tgz
      - name: Publish missing versions and adopt only byte-identical existing versions
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          names=('@latchway/client' '@latchway/openai' '@latchway/vercel-ai' '@latchway/langchain')
          files=(latchway-client-1.0.0.tgz latchway-openai-1.0.0.tgz latchway-vercel-ai-1.0.0.tgz latchway-langchain-1.0.0.tgz)
          for index in "${!names[@]}"; do
            name=${names[$index]}; archive="$RUNNER_TEMP/release/${files[$index]}"
            integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
            if metadata=$("$LATCHWAY_NPM_CLI" view "$name@1.0.0" dist.integrity dist.tarball --json --registry=https://registry.npmjs.org/ 2>"$RUNNER_TEMP/npm-view.err"); then
              test "$(jq -r '.["dist.integrity"] // .dist.integrity' <<<"$metadata")" = "$integrity"
              url=$(jq -er '.["dist.tarball"] // .dist.tarball | select(startswith("https://registry.npmjs.org/"))' <<<"$metadata")
              curl --proto '=https' --tlsv1.2 --fail --location --max-filesize 20971520 --output "$RUNNER_TEMP/existing.tgz" "$url"
              cmp --silent "$archive" "$RUNNER_TEMP/existing.tgz"
            else
              grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-view.err"
              "$LATCHWAY_NPM_CLI" publish "$archive" --access public --provenance --tag latest --ignore-scripts --registry=https://registry.npmjs.org/
            fi
            verified=false
            for attempt in $(seq 1 30); do
              if metadata=$("$LATCHWAY_NPM_CLI" view "$name@1.0.0" dist.integrity dist.tarball --json --registry=https://registry.npmjs.org/ 2>/dev/null); then
                test "$(jq -r '.["dist.integrity"] // .dist.integrity' <<<"$metadata")" = "$integrity"
                url=$(jq -er '.["dist.tarball"] // .dist.tarball | select(startswith("https://registry.npmjs.org/"))' <<<"$metadata")
                curl --proto '=https' --tlsv1.2 --fail --location --max-filesize 20971520 --output "$RUNNER_TEMP/published.tgz" "$url"
                cmp --silent "$archive" "$RUNNER_TEMP/published.tgz" && verified=true && break
              fi
              sleep 10
            done
            test "$verified" = true
          done

  github-release:
    name: Publish exact GitHub release with deferred-assurance notice
    needs: [intent, verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: single-maintainer-v1
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Create once or verify exact release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          set -euo pipefail
          title='Latchway JavaScript SDKs 1.0.0 — single-maintainer v1'
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n' 'Published with the `single_maintainer_v1` profile. External platform/device/provider evidence and independent human review are deferred. This release is not `release_qualified`, fully evidence-gated, or independently reviewed.' > "$notes"
          if ! gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release"/* --verify-tag --title "$title" --notes-file "$notes"
          fi
          gh release view "$RELEASE_TAG" --json tagName,name,body,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          jq -e --arg title "$title" --rawfile body "$notes" '.tagName=="v1.0.0" and .name==$title and .body==$body and .isDraft==false and .isPrerelease==false' "$RUNNER_TEMP/release.json" >/dev/null
          remote=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote" --jq .object.sha)" = "$RELEASE_COMMIT"
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/downloaded"
          diff -qr "$RUNNER_TEMP/release" "$RUNNER_TEMP/downloaded"
